# ==========================================
# Style Exemplars
# ==========================================
# High-quality reference captions spanning different audio types.
# 2-3 are randomly sampled per LLM call as writing-style anchors.
# You can also build a dynamic bank via --style_bank_size at runtime.
style_exemplars: {}

# ==========================================
# Edit Type Pool  (rich & creative)
# ==========================================
edit_type_pool:
  # --- Scene & Environment ---
  - scene_transform         # change environment (studio → rooftop, café → forest, subway → underwater)
  - background_replace      # swap background ambience (traffic → ocean waves, silence → bustling market)
  - weather_change          # add / change weather layer (rain, thunder, wind, crackling frost, hail)
  - spatial_transform       # change acoustic space (bedroom → cathedral, close-mic → across a canyon)
  - time_of_day_shift       # shift temporal feel (dawn chorus → midnight crickets, rush-hour → 3 AM stillness)
  - location_teleport       # drop the same activity into a wildly different place (office meeting → deep cave, kitchen → space station cockpit)
  - season_shift            # change seasonal ambience (summer cicadas → winter wind, spring rain → autumn leaves crunching)

  # --- Content Transformation ---
  - activity_shift          # change what is happening (speaking → singing, playing → tuning, walking → running)
  - genre_morph             # transform musical genre (classical → synthwave, folk → heavy metal, jazz → lo-fi beats)
  - instrument_swap         # replace instruments (piano → marimba, electric guitar → sitar, drums → hand-claps)
  - voice_transform         # alter vocal traits (male → female, child → elderly, whisper → shout, solo → choir)
  - language_shift          # switch language or accent (English → Japanese, Southern drawl → Received Pronunciation)
  - species_swap            # swap the sound source entirely (dog barking → seal barking, bird chirping → baby babbling, cat purring → engine idling)
  - action_reversal         # reverse what's happening (door closing → door opening, applause building → applause fading, engine starting → engine dying)
  - formality_shift         # change register of speech (casual chat → formal lecture, bedtime story → courtroom testimony, debate → lullaby)

  # --- Emotional & Mood ---
  - mood_shift              # change emotional tone (serene → ominous, cheerful → melancholic, tense → relieved)
  - energy_change           # alter energy level (lazy afternoon → frenetic rush, quiet contemplation → wild celebration)
  - tempo_change            # speed / rhythm shift (adagio → presto, steady 4/4 → odd 7/8 meter, rubato → metronomic)
  - tension_arc             # inject suspense buildup or release (calm → slowly creeping dread, frantic → sudden eerie silence)
  - comedic_twist           # add absurd or humorous element (serious lecture interrupted by rubber duck squeak, opera singer hiccups mid-aria)

  # --- Structural ---
  - element_addition        # layer new element (add birdsong, footsteps, a second voice, rain)
  - element_removal         # strip something out (remove drums, silence the TV, mute the crowd)
  - participant_change      # change who or what is present (solo → duet, one dog → a whole kennel, monologue → dialogue)
  - semantic_rewrite        # change spoken words / lyrics while preserving voice character & rhythm
  - narrative_extension     # continue or complete the unfolding scene / story
  - crowd_scaling           # scale population (one person → a stadium crowd, packed bar → empty room with echo, single violin → full orchestra)
  - perspective_shift       # change listener POV (audience seat → backstage, street level → high balcony, inside car → outside car)
  - interruption            # add an unexpected intrusion (phone ringing mid-speech, power outage killing the music, fire alarm during a lecture)
  - foley_reimagine         # replace realistic sound effects with creative stand-ins (footsteps as coconut shells, thunder as metal sheet rumble, rain as rice on tin)

  # --- Quality & Stylistic ---
  - quality_transform       # change fidelity (lo-fi cassette hiss → pristine studio, clean → intentionally degraded)
  - era_shift               # jump decades (1940s big-band → 2020s hyperpop, vinyl crackle → digital clarity)
  - cultural_transform      # cultural re-context (Viennese waltz → West-African highlife, Nashville country → Okinawan min'yō)
  - medium_change           # change medium / format (live concert → phone recording, podcast → loudspeaker PA)
  - style_transfer          # artistic register shift (documentary narration → fairy-tale storytelling, news report → slam poetry)
  - film_genre_filter       # re-score as a movie genre (rom-com → horror soundtrack, thriller → whimsical Wes Anderson, sci-fi → spaghetti western)
  - age_regression          # child-ify or adult-ify the scene (adult choir → children's choir, kids' playground → retirement-home garden, lullaby → bar ballad)
  - mechanisation           # replace organic with mechanical or vice versa (live drummer → drum machine, synth pad → string ensemble, robot voice → warm human voice)
  - underwater_filter       # apply aquatic transformation (muffled, bubbly, whale-song-like reverb on any source)
  - dream_distortion        # surreal / dreamlike reworking (echoing voices, slowed fragments, ghostly reverb, non-linear layering)

# ==========================================
# Creative Edit Params
# ==========================================
creative_edit_params:
  system_prompt: |-
    You are a world-class audio scene architect. Your job: take a source audio description and produce ONE radical, richly-detailed transformation that may cross domain boundaries entirely.

    ═══════════════════════════════════════
    STEP 0 — THINK FIRST  (mandatory "reasoning" field)
    ═══════════════════════════════════════
    Before writing ANYTHING else, you MUST produce an internal monologue in the "reasoning" field:
      1. **Source Anatomy** — What are the core elements? (voices, instruments, ambience, mood, spatial cues, tempo, genre, language…)
      2. **Anchor Decision** — Pick exactly ONE thin anchor to preserve (e.g., "the male voice timbre", "the 120 BPM pulse", "the reverberant space"). Everything else is fair game for radical change.
      3. **Transformation Vision** — Describe in 2-3 sentences the wildly different scene you will create. Be specific: what new layers, participants, textures, and interactions will appear? The target scene should be COMPLEX — multiple simultaneous sound sources interacting.
      4. **Domain Crossing** — Explicitly state whether the target crosses into a different audio domain (speech→music, sound→speech+music, music→environmental soundscape, etc.). Cross-domain jumps are STRONGLY encouraged.

    ═══════════════════════════════════════
    RADICAL CREATIVITY IS YOUR #1 OBJECTIVE
    ═══════════════════════════════════════
    ● Source = speech?  → Don't just add background noise. Turn the reader into a lead vocalist with a gospel choir and a brass section. Or place the monologue inside a nature documentary narrated over whale song and ice cracking.
    ● Source = music?   → Don't just swap genre. Dissolve the band into a bustling Tokyo fish market at dawn with vendors shouting prices over a distant temple bell and forklift beeps.
    ● Source = sound?   → Don't just change location. Transform a ticking clock into a full rhythmic composition: the tick becomes a hi-hat, a dripping faucet adds the kick, a creaking floorboard becomes the bassline, and a child hums a melody over it.
    ● ALWAYS aim for multi-layered scenes with at least 3 distinct sonic elements interacting.
    ● Combine the chosen edit category with unexpected, hyper-specific details — concrete sounds, named places, vivid textures, precise actions, emotional arcs.

    ═══════════════════════════════════════
    CREATIVE EDIT RULES
    ═══════════════════════════════════════
    ● The transformation should be DRAMATIC, not incremental. Think "reimagine" not "tweak".
    ● "Add rain" is lazy. "Fat monsoon drops hammer a corrugated tin roof while a woman inside sings a lullaby to a restless baby, her voice almost drowned out by a sudden rockslide of thunder" is what we want.
    ● Preserve exactly ONE recognisable anchor from the source so the edit feels grounded, not random. Everything else: go wild.
    ● Cross-domain edits are PREFERRED: speech→music scene, music→environmental soundscape, single instrument→full ensemble with vocalists, ambient sound→a narrative scene with dialogue.
    ● The result must describe a physically plausible audio scene (no impossible physics, but surreal/artistic scenes are fine).

    ═══════════════════════════════════════
    edit_prompt RULES
    ═══════════════════════════════════════
    ● Conversational and human — like a creative director briefing a sound designer.
    ● Must be RICH and SPECIFIC — not vague. Describe the transformation you want in vivid detail.
    ● Vary phrasing freely. Examples of tone and specificity:
      - "Strip away everything except his voice, then rebuild the whole thing as a gospel arrangement — I want a full choir doing call-and-response, a Hammond B3 organ swelling underneath, and hand-claps on the backbeat."
      - "Imagine this is playing inside a submarine. I want the metallic echo of the hull, sonar pings in the distance, and the muffled rush of water pressure all around."
      - "Turn the solo piano into a full Afrobeat ensemble — talking drums, a horn section playing staccato riffs, a bassist locking in with the drummer, and a crowd chanting along."
      - "I want this to sound like a memory — the original audio playing from a cheap radio in a sunlit kitchen, mixed with the clinking of coffee cups, a cat purring on the windowsill, and someone humming along."
    ● If speech or lyrics exist, include quotations VERBATIM when relevant.

    ═══════════════════════════════════════
    target_caption RULES
    ═══════════════════════════════════════
    ● Must be a standalone, natural audio description — NEVER mention editing, transforming, modifying, or the source.
    ● **Structure**: The target caption MUST follow the SAME multi-paragraph analytical structure as the provided Style References. Match their paragraph organization, level of technical detail, and descriptive depth. Do NOT mimic the source caption's structure — the Style References are your formatting authority.
    ● **Richness**: The target MUST be a rich, multi-paragraph description with:
      - Paragraph 1: Opening — what hits the listener first, the dominant sonic event
      - Middle paragraphs: Layer-by-layer breakdown of all sound sources, their interactions, spatial placement, and temporal evolution
      - Final paragraph: Overall mood, genre/cultural context, production quality assessment
    ● **Complexity**: Describe a COMPLEX scene with multiple interacting elements. Simple single-layer descriptions are NOT acceptable.
    ● **Length**: Match the detail level and length of the Style References, NOT the source caption. A 2-sentence source should still produce a multi-paragraph target if the Style References are multi-paragraph.
    ● Speech/lyrics must appear VERBATIM in the caption.
    ● Integrate ALL elements from your edit_prompt seamlessly — every sonic detail you promised must appear in the target.

    ═══════════════════════════════════════
    FORMAT EXAMPLES (showing the SCALE of transformation expected)
    ═══════════════════════════════════════
    ● Source: "A man reads a book aloud in a quiet room."
      → {"reasoning": "Source anatomy: single male voice, quiet room ambience, speech domain. Anchor: the male voice timbre and his reading cadence. Transformation: the man becomes the lead vocalist, and I'll build an entire choral-orchestral scene around him. Domain cross: speech → music + speech.", "edit_type": "activity_shift", "edit_prompt": "Turn the man into a lead vocalist. I want him singing the words instead of reading them, with a full choir doing harmonies behind him, acoustic guitar fingerpicking a gentle pattern, and a cello adding a warm low drone. Make it feel like a candlelit chapel performance.", "target_caption": "The audio opens with a solo male voice, warm and resonant, singing in a measured, storytelling cadence that suggests lyrics drawn from prose. His tone is intimate, placed close to the microphone with a slight natural reverb that hints at a stone-walled interior.\n\nWithin the first few seconds, a choir of mixed voices enters softly beneath him — four or five singers sustaining open vowel harmonies in a slow, hymn-like progression. Their voices bloom gradually, panned wide across the stereo field, creating a sense of enveloping warmth. An acoustic guitar, fingerpicked in a delicate arpeggiated pattern, threads through the midrange, its nylon strings producing a mellow, rounded tone that complements the vocal textures without competing.\n\nA solo cello enters in the lower register, bowing a sustained drone that shifts subtly between two notes, adding gravity and emotional depth to the arrangement. The interplay between the lead voice, choir, guitar, and cello is carefully balanced — each occupying a distinct frequency and spatial niche.\n\nThe overall mood is contemplative and devotional, evoking the atmosphere of a candlelit chapel performance. The production is clean and intimate, with minimal processing beyond natural room reverb. The arrangement feels acoustic and organic, prioritizing emotional immediacy over technical complexity."}

    ● Source: "A solo piano plays a gentle classical melody in a concert hall."
      → {"reasoning": "Source anatomy: solo piano, classical genre, concert hall reverb, gentle tempo. Anchor: the melodic contour of the piano. Transformation: dissolve the piano into a bustling street market soundscape where the melody persists as a distant radio playing from a vendor's stall. Domain cross: music → environmental soundscape + embedded music.", "edit_type": "location_teleport", "edit_prompt": "I want to hear this piano melody as if it's leaking from a tinny radio at a crowded Marrakech souk — vendors haggling in Arabic and French, the clatter of copper pots, a donkey braying somewhere, spice-scented wind you can almost hear, and the call to prayer beginning faintly in the distance.", "target_caption": "The clip opens with the dense, layered ambience of an open-air market — dozens of overlapping voices form a continuous murmur, punctuated by sharp bursts of animated haggling in Arabic with occasional French phrases. Metal utensils clang against copper cookware at a nearby stall, producing bright, ringing impacts that cut through the vocal wash.\n\nBeneath the market bustle, a small radio perched on a wooden crate emits a gentle classical piano melody, its tone thinned and slightly distorted by the speaker's limited frequency response. The melody is lyrical and unhurried, tracing a delicate arc that contrasts with the frenetic commercial energy surrounding it. The radio signal crackles faintly during louder market moments.\n\nA donkey brays twice in the middle distance — a raw, nasal sound that briefly dominates the scene before subsiding. Footsteps on packed earth vary in rhythm and weight, suggesting a flow of pedestrians moving through narrow passages. Somewhere to the right, a metalworker hammers in a steady, rhythmic pattern.\n\nAs the clip progresses, the distant call to prayer emerges from a minaret — a solo male voice, amplified and reverberant, singing in elongated, ornamented phrases that float above the market noise. The piano melody on the radio continues underneath, creating an unexpected harmonic dialogue between the sacred vocal line and the secular instrumental piece.\n\nThe overall sonic texture is rich and immersive, capturing the layered complexity of a North African marketplace. The recording has a documentary quality — wide stereo imaging with natural depth cues, no artificial compression, and the organic unpredictability of a real location recording."}

    ● Source: "Rain falling on leaves."
      → {"reasoning": "Source anatomy: nature sound, rain, foliage, no voices or music. Anchor: the rain texture. Transformation: build a full jazz-lounge scene using the rain as atmospheric backdrop — add a jazz trio, a female vocalist, clinking glasses, and bar ambience. Domain cross: environmental sound → music + environmental.", "edit_type": "element_addition", "edit_prompt": "Build a late-night jazz bar around this rain. I want a smoky female vocal singing something slow and aching, a stand-up bass plucking walking lines, brushed drums keeping time, and the rain heard through a half-open window. Add the clink of whiskey glasses and low conversation.", "target_caption": "Rain patters steadily against broad leaves outside a half-open window, its rhythm irregular and organic — a continuous wash of soft, high-frequency texture that serves as the ambient foundation of the scene. Occasional heavier drops strike what sounds like a metal window frame, adding sporadic bright accents.\n\nInside, a female vocalist delivers a slow, torch-song-style performance. Her voice is smoky and controlled, sitting in the alto range with a slight vibrato that intensifies on sustained notes. She phrases behind the beat, lending a languid, melancholic quality to the melody. A subtle room reverb places her a few feet from the microphone in what sounds like a small, acoustically warm space.\n\nA stand-up bass provides the harmonic foundation, its strings plucked in a classic walking-bass pattern — each note round and woody with a satisfying low-end thump. The bassist occasionally slides between notes, adding expressive portamento. Brushed drums maintain a gentle swing feel, the wire brushes circling on the snare head in continuous, whispery arcs with understated kick-drum accents on beats one and three.\n\nIn the background, the ambient layer of a bar quietly unfolds: the crystalline clink of glass against glass, ice cubes shifting in tumblers, a low murmur of conversation just below intelligibility, and the occasional soft scrape of a chair on a wooden floor.\n\nThe overall mood is intimate and bittersweet — a rain-soaked late-night jazz performance in a small, dimly-lit venue. The mix balances the interior music and bar sounds with the exterior rain, creating a three-layer depth (rain → bar ambience → vocal/trio) that feels cinematic in its spatial construction. The recording quality is warm and analog-flavored, with a gentle roll-off above 12 kHz that suggests either vintage equipment or deliberate post-processing."}

    Output ONLY valid JSON — nothing else:
    {"reasoning": "<your internal monologue>", "edit_type": "<category>", "edit_prompt": "<rich, specific user request>", "target_caption": "<new complete multi-paragraph audio description>"}

  user_prompt: |-
    ## Source Audio Description:
    {{ source_caption }}
    {% if style_exemplars %}

    ## Style References (YOUR target_caption MUST match this paragraph structure, analytical depth, and detail level):
    {% for ex in style_exemplars %}
    --- Reference [{{ loop.index }}] ---
    {{ ex }}
    {% endfor %}
    {% endif %}

    ## Your Edit Category Options (pick ONE — these are randomly sampled for you):
    {{ edit_types }}

    ═══════════════════════════════════════
    REMINDERS BEFORE YOU WRITE:
    ═══════════════════════════════════════
    1. START with "reasoning" — explicitly state your anchor (what to keep) and your radical vision (what to change/add).
    2. Cross-domain transformations are PREFERRED (speech↔music↔sound↔mixed).
    3. Your target_caption MUST be multi-paragraph, matching the Style References in structure and depth — NOT the source's structure.
    4. Aim for 3+ distinct sonic layers interacting in the target scene.
    5. Be HYPER-SPECIFIC: name instruments, describe timbres, specify spatial placement, detail temporal evolution.

    ## Output valid JSON only:
    {"reasoning": "<internal monologue>", "edit_type": "<category>", "edit_prompt": "<rich specific request>", "target_caption": "<multi-paragraph audio description>"}

# ==========================================
# Judge Params
# ==========================================
judge_params:
  system_prompt: |-
    You are an AI quality judge for creative audio-edit captions. Given a source caption, an edit request, and the resulting target caption, decide whether the result meets quality standards.

    ═══════════════════════════════════════
    EVALUATION CRITERIA
    ═══════════════════════════════════════
    1. EDIT FIDELITY — Does the target faithfully realize ALL specific elements requested in the edit prompt? Every instrument, voice, texture, and spatial detail mentioned in the edit must appear in the target.
    2. CREATIVITY & AMBITION — Is the transformation dramatic and multi-layered? Trivial changes (e.g., just adding background noise, swapping one word) should be rejected.
    3. COHERENCE — Does the target read as a natural, self-contained audio scene description? No editing jargon, no meta-language, no references to the source.
    4. RICHNESS — Is the target multi-paragraph with detailed layer-by-layer descriptions of sonic elements, their interactions, spatial placement, and temporal evolution? Thin, single-paragraph targets should be rejected.
    5. ANCHOR — Is at least one recognisable element from the source preserved (a voice quality, a rhythmic pattern, a spatial cue, a mood thread)?
    6. PLAUSIBILITY — Could this audio scene physically exist? (Surreal/artistic scenes are acceptable; impossible physics is not.)
    7. SPEECH / LYRICS — If quoted text is involved, is it handled correctly (kept verbatim or intentionally rewritten as the edit demands)?

    ═══════════════════════════════════════
    ALLOWED & ENCOURAGED (do NOT penalise)
    ═══════════════════════════════════════
    - Dramatic, radical scene changes — this is EXPECTED
    - Cross-domain transformations (speech→music scene, sound→narrative with dialogue, etc.)
    - Complete re-imagining of setting, mood, genre, or participants
    - Target being MUCH longer or more detailed than the source — the target should match style-reference quality, not source length
    - Different paragraph structure from the source — structure should be analytical and multi-layered regardless of source format
    - Removal of major source elements IF the edit demands it

    ═══════════════════════════════════════
    REJECT if
    ═══════════════════════════════════════
    - Target contains editing meta-language ("the background was replaced …", "we added …", "the original audio was transformed …")
    - Target is thin or lazy — fewer than 3 paragraphs, or lacks specific sonic details (timbres, spatial cues, temporal evolution)
    - Scene is incoherent or physically impossible (not merely surreal)
    - Zero connection to the source remains (no anchor at all)
    - Target simply paraphrases the source with no meaningful change
    - Edit prompt is vague or generic (e.g., "make it different", "add some sounds") without specific sonic vision
    - Promised elements in the edit prompt are MISSING from the target caption

    Return strict JSON only:
    {"valid": true/false, "reason": "Concise explanation (max 50 words)"}

  judge_user_prompt: |-
    ## Source Caption:
    {{ source_caption }}

    ## Edit Request:
    {{ edit_prompt }}

    ## Target Caption:
    {{ target_caption }}

    ## Evaluation Checklist:
    1. Does the target realize EVERY specific element from the edit request?
    2. Is the transformation dramatic (not just a minor tweak)?
    3. Is the target multi-paragraph with rich sonic detail?
    4. Is at least one anchor from the source preserved?
    5. Is the scene coherent and plausible?

    ## Return strict JSON only:
    {"valid": true/false, "reason": "Concise explanation"}
