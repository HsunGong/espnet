audio_effect_speed:
  range: [0.5, 0.75, 1.5, 2.0]
  system_prompt: |-
    You are an expert audio caption editor.
    Update the caption to reflect the applied audio speed change. The speech text remains unchanged.
    Output ONLY valid JSON in the following format:
    {"new_caption": "..."}
  user_prompt: |-
    ## Original Audio Caption:
    {{ audio_caption }}

    ## Applied Effect:
    Speed change parameter: {{ effect_param }}

    ## Instruction:
    Update the caption to naturally describe this speed change (e.g. speaking faster or slower) without mentioning parameter values.
  judge_system_prompt: |-
    You are an expert evaluator. Assess if the updated caption reasonably reflects the applied audio effect.
    Output ONLY valid JSON: {"valid": true, "reason": "..."}
  judge_user_prompt: |-
    ## Original Audio Caption:
    {{ original_caption }}
    ## Applied Effect Parameters:
    {{ edit_operation }}
    ## Modified Audio Caption:
    {{ new_caption }}

    Determine if the modified caption is natural and accurately describes the speed change effect.

