vllm:
  url: "http://cnode1-010:8100/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  max_tokens: 4096
  temperature: 0.7

captioner:
  url: "http://cnode1-010:9000/v1"
  model: "Qwen/Qwen3-Omni-30B-A3B-Captioner"

judge:
  url: "http://cnode1-010:8100/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  max_tokens: 4096
  temperature: 0.2

transcription_ins:
  words_range: [2, 8]
  system_prompt: |-
    You are an expert audio transcription and caption editor.

    TASK:
    1. identify the current text and create an edit prompt to insert words.
    - The modified sentence must remain fluent and reasonable.
    - The writing style is `Insert '...' between word A and B` or `Insert '...' at the start/end of the sentece`
    
    2. Insert words into the given transcription, and process new text.
    - The new text should strictly follow the edit prompt.
    3. Update the caption to STRICTLY MATCH the modified transcription.
    - Update the caption to reflect the modified transcription WITHOUT mentioning any **editing** action, make it natural.
    - Keep the caption writing style consistent with the original caption (similar tone, level of detail, and structure).
    - Do not add new facts beyond what is supported by the transcription/caption context.

    OUTPUT:
    Return ONLY valid JSON with exactly these keys:
    {
      "edit_operation": ...,
      "new_asr_text": "...",
      "new_caption": "...",
    }

  user_prompt: |-
    ## Original Transcription:
    {{ text }}

    ## Original Audio Caption:
    {{ audio_caption }}

    ## Instruction:
    Insert at least {{ min_w }} words, at most {{ max_w }} words into the original transcription. The sentence must remain fluent and reasonable.

  judge_system_prompt: |-
    You are an expert evaluator.

    You MUST verify THREE things:
    (A) Alignment: The modified text is correct after edition on original text.
    (B) Fluency: The modified text is fluent and reasonable.
    (C) Caption: The modified caption (1) matches the modified text and (2) does NOT mention word indices/positions or describe the edit operation. (3) the caption writing style is exactly similar to the original caption.

    Return ONLY valid JSON:
    {"valid": true/false, "reason": "Brief but concrete. Mention inferred insertion position and whether it matches."}

  judge_user_prompt: |-
    ## Original Text:
    {{ original_text }}

    ## Original Audio Caption:
    {{ original_caption }}

    ## Edit Operation Applied (must be 1-based):
    {{ edit_operation }}

    ## Modified Text:
    {{ new_text }}

    ## Modified Audio Caption:
    {{ new_caption }}

transcription_del:
  words_range: [2, 5]

  system_prompt: |-
    You are an expert audio transcription and caption editor.

    TASK:
    1. Identify removable words in the current text and create an edit prompt to delete words.
    - The modified sentence must remain fluent and reasonable.
    - Do NOT remove essential semantic content that breaks the sentence.
    - The writing style is `Delete '...'` (must match exact phrase from text).

    2. Delete words from the given transcription and process new text.
    - The new text should strictly follow the edit prompt.

    3. Update the caption to STRICTLY MATCH the modified transcription.
    - Update the caption to reflect the modified transcription WITHOUT mentioning any **editing** action.
    - Keep the caption writing style consistent with the original caption (similar tone, level of detail, and structure).
    - Do not add new facts beyond what is supported by the transcription/caption context.
    - It should looks like a new caption that generated from the target audio with same writing style.

    OUTPUT:
    Return ONLY valid JSON with exactly these keys:
    {
      "edit_operation": ...,
      "new_asr_text": "...",
      "new_caption": "...",
    }

  user_prompt: |-
    ## Original Transcription:
    {{ text }}

    ## Original Audio Caption:
    {{ audio_caption }}

    ## Instruction:
    Delete at least {{ min_w }} words, at most {{ max_w }} words from the original transcription. The sentence must remain fluent and reasonable.

  judge_system_prompt: |-
    You are an expert evaluator.

    You MUST verify THREE things:
    (A) Alignment: The modified text correctly removes the exact phrase specified in edit_operation.
    (B) Fluency: The modified text is fluent and reasonable.
    (C) Caption: The modified caption (1) matches the modified text and (2) does NOT mention deletion or editing. (3) writing style is consistent with the original caption.

    Return ONLY valid JSON:
    {"valid": true/false, "reason": "Brief but concrete. Mention deleted phrase and whether removal matches."}

  judge_user_prompt: |-
    ## Original Text:
    {{ original_text }}

    ## Original Audio Caption:
    {{ original_caption }}

    ## Edit Operation Applied:
    {{ edit_operation }}

    ## Modified Text:
    {{ new_text }}

    ## Modified Audio Caption:
    {{ new_caption }}

transcription_sub:
  words_range: [2, 5]
  system_prompt: |-
    You are an expert audio transcription and caption editor.

    TASK:
    1. Identify words in the current text that can be substituted and create an edit prompt.
    - The meaning should remain similar or slightly refined.
    - The modified sentence must remain fluent and reasonable.
    - The writing style is `Replace 'A' with 'B'`.

    2. Substitute words in the given transcription.
    - The new text must strictly follow the edit prompt.

    3. Create a new caption to STRICTLY MATCH the modified transcription.
    - Do NOT mention any editing action.
    - Maintain original caption tone, structure, and detail level.
    - Do not introduce unsupported facts.
    - It should looks like a new caption that generated from the target audio with same writing style.

    OUTPUT:
    Return ONLY valid JSON with exactly these keys:
    {
      "edit_operation": ...,
      "new_asr_text": "...",
      "new_caption": "...",
    }

  user_prompt: |-
    ## Original Transcription:
    {{ text }}

    ## Original Audio Caption:
    {{ audio_caption }}

    ## Instruction:
    Substitute at least {{ min_w }} words, at most {{ max_w }} words in the original transcription. The sentence must remain fluent and reasonable.

  judge_system_prompt: |-
    You are an expert evaluator.

    You MUST verify:
    (A) Alignment: The substitution strictly matches edit_operation.
    (B) Fluency: The modified text is fluent and semantically reasonable.
    (C) Caption: The modified caption (1) matches the modified text and (2) does NOT mention subsutition or editing, just look as a natural new caption. (3) writing style is consistent with the original caption.

    Return ONLY valid JSON:
    {"valid": true/false, "reason": "Brief. Mention replaced phrase and correctness."}

  judge_user_prompt: |-
    ## Original Text:
    {{ original_text }}

    ## Original Audio Caption:
    {{ original_caption }}

    ## Edit Operation Applied:
    {{ edit_operation }}

    ## Modified Text:
    {{ new_text }}

    ## Modified Audio Caption:
    {{ new_caption }}

transcription_replace_sentence:
  system_prompt: |-
    You are an expert audio transcription and caption editor.

    TASK:
    1. Output an edit prompt to create an entirly new sentence.
    - write an entire new sentence with similar length of the oringal text.
    - The writing style is `Rewrite the sentence with '(new content)'`.

    2. Output the new transcription.
    - The new transcription must be exactly the same as described in edit prompt.

    3. Create a new caption to STRICTLY MATCH the new transcription.
    - Do NOT mention any editing action.
    - Maintain original caption tone, structure, and detail level.
    - Do not introduce unsupported facts.
    - It should looks like a new caption that generated from the target audio with same writing style.

    OUTPUT:
    Return ONLY valid JSON with exactly these keys:
    {
      "edit_operation": ...,
      "new_asr_text": "...",
      "new_caption": "...",
    }

  user_prompt: |-
    ## Original Transcription length:
    {{ text.split() | length }}

    ## Original Audio Caption:
    {{ audio_caption }}

    ## Instruction:
    Continue write an entire sentence with a new fluent and reasonable sentence.

  judge_system_prompt: |-
    You are an expert evaluator.

    Verify:
    (A) The new text exactly matches the edit operation.
    (B) The new sentence should be fluent and contextually consistent.
    (C) Caption: The new caption (1) matches the new text and (2) does NOT mention any replace or editing or continuation, just look as a natural new caption. (3) writing style should be consistent with the original caption.

    Return ONLY valid JSON:
    {"valid": true/false, "reason": "Brief explanation about full sentence replacement validity."}

  judge_user_prompt: |-
    ## Original Audio Caption:
    {{ original_caption }}

    ## Edit Operation Applied:
    {{ edit_operation }}

    ## Newly generated Text:
    {{ new_text }}

    ## Newly generated Caption:
    {{ new_caption }}

transcription_add_paralinguistic:
  tags: ["[sigh]", "[laugh]", "[exhale]", "[snort]", "[cough]", "[uhm]", "[Surprise-oh]", "[Surprise-wa]", "[Dissatisfaction-hnn]", "[Question-ah]", "[Question-yi]"]

  system_prompt: |-
    You are an expert audio transcription and caption editor.

    TASK:
    1. Add paralinguistic information (e.g., [laughs], [sigh] ...) into the transcription.
    - It must be reasonable within context.
    - Use square brackets format.
    - The writing style is `Insert a [laugh] at the start/end of the sentence` or `Insert a [sigh] between word A and B`.
    2. Insert words into the given transcription, and process new text.
    - The new text should strictly follow the edit prompt.
    3. Update the caption to STRICTLY MATCH the modified transcription.
    - Update the caption to reflect the modified transcription WITHOUT mentioning any **editing** action, make it natural.
    - Keep the caption writing style consistent with the original caption (similar tone, level of detail, and structure).
    - Do not add new facts beyond what is supported by the transcription/caption context.

    OUTPUT:
    Return ONLY valid JSON with exactly these keys:
    {
      "edit_operation": ...,
      "new_asr_text": "...",
      "new_caption": "...",
    }

  user_prompt: |-
    ## Original Transcription:
    {{ text }}

    ## Original Audio Caption:
    {{ audio_caption }}

    ## Instruction
    Add the paralinguistic tag {{ tag }} naturally into the transcription. The sentence must remain fluent and reasonable.

  judge_system_prompt: |-
    You are an expert evaluator.

    You MUST verify THREE things:
    (A) Alignment: The modified text is correct after edition on original text.
    (B) Fluency: The modified text is fluent and reasonable.
    (C) Caption: The modified caption (1) matches the modified text and (2) does NOT mention word indices/positions or describe the edit operation. (3) the caption writing style is exactly similar to the original caption.

    Return ONLY valid JSON:
    {"valid": true/false, "reason": "Brief but concrete. Mention inferred insertion position and whether it matches."}

  judge_user_prompt: |-
    ## Original Text:
    {{ original_text }}

    ## Original Audio Caption:
    {{ original_caption }}

    ## Edit Operation Applied (must be 1-based):
    {{ edit_operation }}

    ## Modified Text:
    {{ new_text }}

    ## Modified Audio Caption:
    {{ new_caption }}



style_whisper:
  styles: ['serious', 'arrogant', 'child', 'older', 'girl', 'pure', 'sister', 'sweet', 'ethereal', 'whisper', 'gentle', 'recite', 'generous', 'act_coy', 'warm', 'shy', 'comfort', 'authority', 'chat', 'radio', 'soulful', 'story', 'vivid', 'program', 'news', 'advertising', 'roar', 'murmur', 'shout', 'deeply', 'loudly', 'remove', 'exaggerated']

  system_prompt: |-
    You are an expert audio transcription and vocal delivery editor.

    TASK:
    1. Generate an editing prompt to change the speaking style (with a given style tag).
    - The writing style is like `change the speaking style to (a child voice, a whisper style, ...)`
    2. Update the caption to STRICTLY MATCH the new vocal tone.
    - The caption should describe the speaker's tone, emotion, or delivery method without mentioning "editing tags" or technical operations.
    - Keep the caption style consistent with the original (similar length and structure).
    - Do not change any transcription text.

    OUTPUT:
    Return ONLY valid JSON with exactly these keys:
    {
      "edit_prompt": "...",
      "new_caption": "..."
    }

  user_prompt: |-
    ## Original Transcription:
    {{ text }}

    ## Original Audio Caption:
    {{ audio_caption }}

    ## Instruction
    Apply the vocal style "{{ style }}" to the audio.

  judge_system_prompt: |-
    You are an expert evaluator for audio-text styling.

    You MUST verify THREE things:
    (A) Edit Prompt Alignmeent: The edit prompt should be compatiable with the new vocal style.
    (B) New Caption Alignmeent: The modified caption should be compatiable with the new vocal style.
    (C) Caption writting rules: (1) describes the new vocal delivery (e.g., "spoken in a shy tone") rather than the tag itself, and (2) maintains the structural integrity of the original caption.

    Return ONLY valid JSON:
    {"valid": true/false, "reason": "Concrete explanation of style appropriateness and caption alignment."}

  judge_user_prompt: |-
    ## Original Audio Caption:
    {{ original_caption }}

    ## Style Applied:
    {{ style }}

    ## Edit Prompt:
    {{ edit_operation }}

    ## Modified Audio Caption:
    {{ new_caption }}

