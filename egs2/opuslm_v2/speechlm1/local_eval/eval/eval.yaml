runtime:
  num_workers: 8

# ---------------------------------------------------------------------------
# Shared LLM judge system prompt (anchor used by all tasks below)
# ---------------------------------------------------------------------------
_llm_judge_system_prompt: &llm_judge_sys |-
  You are an expert speech audio evaluator.
  You will receive two audio clips:
    - **Audio A** = the ORIGINAL audio (before editing)
    - **Audio B** = the EDITED audio (after editing)
  Compare them carefully and assess the edit precisely and objectively
  on multiple quality aspects.

  Scoring rubric for EACH aspect (integer 1–5):
    5 = Excellent — flawless, no issues at all
    4 = Good — minor imperfections, largely successful
    3 = Fair — noticeable issues but partially correct
    2 = Poor — significant problems, barely acceptable
    1 = Very Poor — complete failure on this aspect

  Be strict, consistent, and unbiased.
  Output ONLY valid JSON with the keys specified in the user message.

# ============================================================================
# Scorer definitions
# ============================================================================
scorers:
  asr_wer:
    resume: false
    model_name: openai/whisper-large-v3
    batch_size: 24
    language: en

  speaker_similarity_wespeaker:
    model_id: "english"
    device: "cuda"

  speaker_similarity_wavlm:
    # resume: false
    model_name: "wavlm_large"
    checkpoint: ./downloads/wavlm_large_finetune.pth
    device: "cuda"
    batch_size: 1

  llm_judge_gemini:
    # resume: false
    batch_size: 512
    max_samples: 100
    model_kwargs:
      model: "gemini-3-flash-preview"

  llm_judge_openai:
    # resume: false
    model:
      base_url: "http://cnode1-002:8000/v1"
      model: "Qwen/Qwen3-Omni-30B-A3B-Thinking"
    batch_size: 256
    max_samples: 10000
    # default_kwargs:
    #   temperature: 0.1
    #   max_tokens: 1024

  llm_judge_caption_llm:
    # resume: false
    batch_size: 256
    captioner:
      base_url: "http://cnode1-004:8000/v1,http://cnode1-004:8001/v1,http://cnode1-004:8003/v1,http://cnode1-004:8004/v1,http://cnode1-004:8005/v1,http://cnode1-004:8006/v1,http://cnode1-004:8007/v1"
      model: "Qwen/Qwen3-Omni-30B-A3B-Captioner"
    judge_model:
      base_url: "http://cnode1-002:8000/v1"
      model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
      default_kwargs:
        temperature: 0.2
        max_tokens: 2048
    # embedding_model — required when a task sets `mode: embedding`.
    # Provide base_url + model that serve /v1/embeddings.
    embedding_model:
      base_url:  "http://cnode1-010:8000/v1"
      model: "Qwen/Qwen3-Embedding-4B"

  audio_event_flam:
    model_name: "v1-base"
    ckpt_path: "/tmp/openflam"
    device: "cuda"
    vllm_client:
      base_url: "http://cnode1-002:8000/v1"
      model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"

  fad:
    embedding: "encodec-24k"
    device: "cuda"

  speed_duration:
    relative_tolerance: 0.15

  volume_loudness:
    delta_tolerance_db: 3.0

  pitch_shift:
    semitone_tolerance: 1.5

  pseudo_mos:
    use_gpu: true
    cache_dir: "versa_cache"
    predictor_types: ["utmos", "dnsmos"]
    predictor_args:
      dnsmos:
        fs: 16000
    aggregate_keys: ["utmos", "dns_overall", "dns_p808"]
    aggregate_weights:
      utmos: 0.5
      dns_overall: 0.3
      dns_p808: 0.2
    metric_bounds:
      utmos: [1.0, 5.0]
      dns_overall: [1.0, 5.0]
      dns_p808: [1.0, 5.0]
    normalize_aggregate: true
    allow_download: false

  emotion_modelscope:
    model: "iic/emotion2vec_plus_large"
    gen_kwargs:
      batch_size: 32

  clap_similarity:
    # resume: false
    enable_fusion: false
    device: cuda
    vllm_client:
      base_url: "http://cnode1-002:8000/v1"
      model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"

# =============================================================================
# Shared Scorer Configurations — YAML Anchors
# =============================================================================
# NOTE: The `_anchors` key is ignored by the eval runner; it only serves as a
#       home for YAML anchors that are referenced in the `tasks` section below.
audio_edit_anchors:
  # =============================================================================
  # eval_nonspeech.yaml
  # Evaluation config for non-speech audio edit tasks:
  #   ADD / REMOVE / REPLACE  (gen.yaml data)
  #   CREATIVE EDIT            (gen_v3.yaml data)
  #
  # Four scorer backends:
  #   1. llm_judge_openai      — Qwen3-Omni via vLLM  (direct audio → judge)
  #   2. llm_judge_caption_llm — Captioner + text-LLM judge pipeline
  #   3. llm_judge_gemini      — Gemini multimodal     (direct audio → judge)
  #   4. fad                   — Fréchet Audio Distance (corpus-level)
  #
  # Evaluation Dimensions (for LLM judges):
  #   edit_fidelity  (1-5) — Was the edit correctly applied?
  #   audio_quality  (1-5) — Production quality, artifacts, distortion
  #   coherence      (1-5) — Scene coherence, naturalness of blend
  #   preservation   (1-5) — Are non-edited elements intact?
  #   score          (1-5) — Overall quality
  # =============================================================================

  # ===========================================================================
  #  ADD OPERATION
  # ===========================================================================
  add_scorers: &add_scorers
    # --- OpenFLAM audio-event detector ---
    - name: clap_similarity
    - name: fad
    # - name: audio_event_flam

    # --- Qwen3-Omni (audio → direct judge) ---
    - name: llm_judge_openai
      score_key: score
      score_keys: [score, consistency, change_quality]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an extremely strict, meticulous audio engineer and sound design expert. You are evaluating an ADD operation: Audio2 was created by layering a new sound element onto Audio1.

        You must base your judgment ONLY on:
        - Audio1 (original)
        - Audio2 (edited)
        - Edit-Prompt (instruction)

        Ignore any captions/descriptions entirely, even if provided.

        ## Edit-Prompt
        {{ edit_prompt }}

        ## Original Audio Description
        {{ audio_caption }}

        ## Element Being Added
        {{ add_audio_caption }}

        ## Task
        Compare Audio1 vs Audio2 and judge whether Audio2:
        (A) Preserves all original content that should NOT have changed (consistency), and
        (B) Successfully adds the requested element with natural blending (change quality).

        Use a very strict grading curve:
        5 = near-flawless, professional/studio-quality.
        Most typical AI outputs should fall in the 2–3 range.

        ## Metrics (ONLY these)
        1) consistency (1-5): Preservation / Faithfulness
          Did Audio2 preserve the original audio content from Audio1 without degradation?
          Check for: damage to original elements, altered timing/rhythm, unexpected volume changes, removed content, tonal shifts, or AI artifacts that corrupt the original character.
          5 = original content fully preserved and natural
          3 = mostly preserved but noticeable degradation or alterations
          1 = original content severely damaged or unrecognizable

        2) change_quality (1-5): Change Execution Quality
          Is the added element clearly audible in Audio2 and does it blend naturally with the original?
          Check for: missing/faint added element, unnatural layering, loudness mismatch, spectral clashes, phase issues, artifacts at blend boundaries, or incoherent scene composition.
          5 = added element is present, well-balanced, and seamlessly blended
          3 = added element is present but blending/balance is noticeably off
          1 = added element is absent or completely fails to integrate

        3) score (1-5): Overall (NOT a simple average)
          If there is any critical failure (added element missing OR original content severely damaged), the overall score must drop significantly.
          Score 5 should be rare and only given when both metrics are near-perfect.

        ## Output format
        Output ONLY valid JSON. Do not include any extra text.
        Use EXACTLY these keys (do not add others):
        {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

    # # --- Captioner + LLM Judge ---
    # - name: llm_judge_caption_llm
    #   score_key: score
    #   score_keys: [score, edit_fidelity, audio_quality, coherence, preservation]
    #   system_prompt: |-
    #     You are an expert audio edit evaluator. You will compare an automatic
    #     caption of the generated audio against the expected description to
    #     evaluate an ADD operation (layering a new element onto original audio).

    #     Evaluate:
    #     1. edit_fidelity (1-5): Does the caption indicate the added element
    #        is present? 5 = fully present, 1 = completely absent.
    #     2. audio_quality (1-5): Based on the caption, does the audio seem
    #        well-produced without artifacts?
    #     3. coherence (1-5): Does the caption describe a coherent, unified
    #        audio scene?
    #     4. preservation (1-5): Does the caption indicate original elements are
    #        preserved?
    #     5. score (1-5): Overall quality.

    #     Output ONLY valid JSON:
    #     {"edit_fidelity": <1-5>, "audio_quality": <1-5>, "coherence": <1-5>, "preservation": <1-5>, "score": <1-5>, "reason": "<≤60 words>"}
    #   user_prompt: |-
    #     ## Edit Instruction
    #     {{ edit_prompt }}

    #     ## Original Audio Description
    #     {{ audio_caption }}

    #     ## Element That Was Added
    #     {{ add_audio_caption }}

    #     ## Generated Audio Caption (automatic captioner output)
    #     {{ target_caption_gen_now }}

    #     ## Expected Audio Description (reference)
    #     {{ target_audio_caption }}

    #     Evaluate whether the ADD edit was successfully applied.

    # --- Gemini (audio → direct judge) ---
    - name: llm_judge_gemini
      score_key: score
      score_keys: [score, generation_quality, main_consistency, operation_effect]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an expert audio evaluator. You will listen to two audio clips:
          - **Audio A** = the ORIGINAL audio (before editing)
          - **Audio B** = the EDITED audio (after editing)

        An ADD operation was performed: a new sound element was layered onto
        the original audio track.

        ## Edit Instruction
        {{ edit_prompt }}

        ## Main Audio Content (should be preserved)
        {{ audio_caption }}
        {% if metadata is defined and metadata.main is defined and metadata.main.human_labels is defined %}Event labels: {{ metadata.main.human_labels | join(", ") }}{% endif %}

        ## Element That Was Added
        {{ add_audio_caption | default('') }}
        {% if metadata is defined and metadata.y is defined and metadata.y.human_labels is defined %}Event labels: {{ metadata.y.human_labels | join(", ") }}{% endif %}

        Evaluate carefully on these dimensions:

        1. **generation_quality** (1-5): Overall production quality of Audio B.
           Assess clarity, naturalness, absence of artifacts/distortion/clipping.
           5 = studio quality, 1 = heavily distorted or unintelligible.

        2. **main_consistency** (1-5): Is the main audio content described above
           preserved consistently between Audio A and Audio B?
           5 = perfectly preserved, 1 = main content completely altered or missing.

        3. **operation_effect** (1-5): Was the ADD operation successfully executed?
           Is the added element clearly audible in Audio B while blending naturally?
           5 = element fully present and well-blended, 1 = completely absent.

        4. **score** (1-5): Holistic overall assessment.

        Output ONLY valid JSON:
        {"generation_quality": <1-5>, "main_consistency": <1-5>, "operation_effect": <1-5>, "score": <1-5>, "reason": "<≤60 words>"}


  # ===========================================================================
  #  REMOVE OPERATION
  # ===========================================================================
  remove_scorers: &remove_scorers
    # --- OpenFLAM audio-event detector ---
    - name: clap_similarity
    - name: fad
    # - name: audio_event_flam

    # --- Qwen3-Omni ---
    - name: llm_judge_openai
      score_key: score
      score_keys: [score, consistency, change_quality]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an extremely strict, meticulous audio engineer and sound design expert. You are evaluating a REMOVE operation: Audio2 was created by removing a specific sound element from Audio1.

        You must base your judgment ONLY on:
        - Audio1 (original, contains the element to be removed)
        - Audio2 (edited, element should be absent)
        - Edit-Prompt (instruction)

        Ignore any captions/descriptions entirely, even if provided.

        ## Edit-Prompt
        {{ edit_prompt }}

        ## Original Audio Description
        {{ audio_caption }}

        ## Element That Should Be Removed
        {{ remove_audio_caption }}

        ## Task
        Compare Audio1 vs Audio2 and judge whether Audio2:
        (A) Preserves all content that should NOT have changed (consistency), and
        (B) Successfully removes the target element cleanly (change quality).

        Use a very strict grading curve:
        5 = near-flawless, professional/studio-quality.
        Most typical AI outputs should fall in the 2–3 range.

        ## Metrics (ONLY these)
        1) consistency (1-5): Preservation / Faithfulness
          Did Audio2 preserve all audio content from Audio1 EXCEPT the removed element?
          Check for: collateral damage to remaining sounds, altered timing/rhythm, unnatural silences or gaps where content should remain, tonal shifts, or AI artifacts corrupting preserved elements.
          5 = all non-target content fully preserved and natural
          3 = mostly preserved but noticeable collateral damage or gaps
          1 = severe damage to content that should have been kept

        2) change_quality (1-5): Change Execution Quality
          Is the target element completely and cleanly removed from Audio2?
          Check for: residual traces of the removed element, spectral holes, phase artifacts, clicks/pops at removal boundaries, unnatural silence patches, or remnant sounds that should be gone.
          5 = element fully removed with no audible artifacts
          3 = mostly removed but residual traces or removal artifacts remain
          1 = element still clearly present or removal causes severe artifacts

        3) score (1-5): Overall (NOT a simple average)
          If there is any critical failure (element still present OR remaining content severely damaged), the overall score must drop significantly.
          Score 5 should be rare and only given when both metrics are near-perfect.

        ## Output format
        Output ONLY valid JSON. Do not include any extra text.
        Use EXACTLY these keys (do not add others):
        {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

    # # --- Captioner + LLM Judge ---
    # - name: llm_judge_caption_llm
    #   score_key: score
    #   score_keys: [score, edit_fidelity, audio_quality, coherence, preservation]
    #   system_prompt: |-
    #     You are an expert audio edit evaluator. You will compare an automatic
    #     caption of the generated audio against the expected description to
