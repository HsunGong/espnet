  # ------------------------------------------------------------------
  audio_effect_reverb:
    scorers:
      - name: llm_judge_openai
        audio_keys: [audio_path, eval_audio_path]
        system_prompt: *llm_judge_sys
        user_prompt: &reverb_user |-
          The first audio is **Audio A** (original, no reverb), the second is **Audio B** (edited).

          ## Edit Instruction
          {{ edit_prompt }}

          Compare Audio A and Audio B, then evaluate the reverb effect on these aspects:

          1. **effect_presence** (1-5): Is the reverberation / echo effect clearly and
             appropriately present in Audio B compared to the dry Audio A?
          2. **intelligibility** (1-5): Despite the reverb in Audio B, is the speech
             content still clearly intelligible and understandable?
          3. **naturalness** (1-5): Does Audio B's reverb sound like a natural acoustic
             environment (e.g., room, hall) rather than artificial processing?
          4. **audio_quality** (1-5): Is Audio B's overall audio quality maintained
             without excessive distortion, clipping, or unwanted noise compared to Audio A?

          Output ONLY valid JSON:
          {"effect_presence": <1-5>, "intelligibility": <1-5>, "naturalness": <1-5>, "audio_quality": <1-5>, "reason": "brief explanation"}

