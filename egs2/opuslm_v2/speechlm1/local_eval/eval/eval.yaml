runtime:
  num_workers: 8

scorers:
  asr_wer:
    resume: false
    model_name: openai/whisper-large-v3
    batch_size: 32
    language: en

  speaker_similarity_wespeaker:
    model_id: "english"
    device: "cuda"

  speaker_similarity_wavlm:
    model_name: "wavlm_large"
    checkpoint: ./downloads/wavlm_large_finetune.pth
    device: "cuda"
    batch_size: 1 # have to be one, see the source code fore more

  llm_judge_gemini:
    batch_size: 512
    max_samples: 15
    model_kwargs:
      model: "gemini-2.5-flash-preview"

  llm_judge_caption_llm:
    batch_size: 512
    captioner:
      base_url: "http://cnode1-002:8000/v1,http://cnode1-002:8001/v1,http://cnode1-002:8002/v1,http://cnode1-002:8003/v1,http://cnode1-002:8004/v1,http://cnode1-002:8005/v1,http://cnode1-002:8006/v1,http://cnode1-002:8007/v1"
      model: "Qwen/Qwen3-Omni-30B-A3B-Captioner"
      # decode_kwargs:
      #   temperature: 0.65
      #   max_tokens: 1024

    judge_model:
      base_url: "http://cnode1-001:8000/v1"
      model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
      default_kwargs:
        temperature: 0.2
        max_tokens: 1024

  speed_duration:
    relative_tolerance: 0.15

  volume_loudness:
    delta_tolerance_db: 3.0

  pitch_shift:
    semitone_tolerance: 1.5

  pseudo_mos:
    use_gpu: true
    cache_dir: "versa_cache"
    predictor_types: ["utmos", "dnsmos"]
    predictor_args:
      dnsmos:
        fs: 16000
    aggregate_keys: ["utmos", "dns_overall", "dns_p808"]
    aggregate_weights:
      utmos: 0.5
      dns_overall: 0.3
      dns_p808: 0.2
    metric_bounds:
      utmos: [1.0, 5.0]
      dns_overall: [1.0, 5.0]
      dns_p808: [1.0, 5.0]
    normalize_aggregate: true
    allow_download: false

  # emotion_modelscope:
    model: "iic/emotion2vec_plus_large"
    gen_kwargs:
      batch_size: 32

tasks:
  # transcription_*: only WER + SPK
  transcription_ins:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

  transcription_del:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  transcription_sub:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  transcription_replace_sentence:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  transcription_add_paralinguistic:
    scorers:
      # - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: llm_judge_caption_llm
        score_key: score
        system_prompt: |-
          You are an expert evaluator.
          Assess if the modified caption reflects added paralinguistic features at correct position.
          
          Output ONLY valid JSON: {"score": <0/1>, "reason": "..."}
        user_prompt: |-          
          ## Edit Prompt
          {{ edit_prompt }}

          ## Expected Text
          {{ target_text }}
          
          ## Target Audio Caption
          {{ target_caption_gen_now }}

          Determine if the modified caption naturally and accurately indicates the presence of new paralinguistic features.

      - name: llm_judge_gemini
        score_key: score
        audio_keys:
          - eval_audio_path
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          Listen to the audio carefully.
          Evaluate whether the specified paralinguistic feature (e.g., laughter, cough, breath, filled pause) is present
          at the correct position as described in the edit instruction, and that the surrounding speech content is preserved.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  style_whisper:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: llm_judge_caption_llm
        score_key: score
        system_prompt: |-
          You are an expert evaluator.
          Assess if the modified caption reflects the new speaking style.
          
          Output ONLY valid JSON: {"score": <0/1>, "reason": "..."}
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          ## Original Audio Caption
          {{ audio_caption }}

          ## Expected Audio Caption After Edit
          {{ target_audio_caption }}

          Determine if the modified caption naturally and accurately reflects the target speaking style described in the edit instruction.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}
      - name: llm_judge_gemini
        score_key: score
        audio_keys:
          - eval_audio_path
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          Listen to the audio carefully.
          Evaluate whether the speaking style (e.g., whispering, pacing, pitch, tone) matches the target style
          described in the edit instruction, while the speech content remains intact.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  style_emotion:
    scorers:
      - name: asr_wer
      - name: emotion_modelscope
      - name: llm_judge_caption_llm
        score_key: score
        system_prompt: |-
          You are an expert evaluator.
          Assess if the modified caption reflects a change in emotion as described in the edit instruction.
          
          Output ONLY valid JSON: {"score": <0/1>, "reason": "..."}
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          ## Original Audio Caption
          {{ audio_caption }}

          ## Expected Audio Caption After Edit
          {{ target_audio_caption }}

          Determine if the modified caption naturally and accurately reflects the target emotion described in the edit instruction.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}

      - name: llm_judge_gemini
        score_key: score
        audio_keys:
          - eval_audio_path
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          Listen to the audio carefully.
          Evaluate whether the speaker's emotional expression (e.g., happy, sad, angry, surprised) matches
          the target emotion described in the edit instruction, while the speech content remains intact.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  audio_effect_speed:
    scorers:
      - name: speed_duration
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  audio_effect_volume:
    scorers:
      - name: volume_loudness
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  audio_effect_pitch:
    scorers:
      - name: pitch_shift
      - name: asr_wer
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  audio_effect_reverb:
    scorers:
      - name: llm_judge_caption_llm
        score_key: score
        system_prompt: |-
          You are an expert evaluator.
          Assess if the modified caption reflects added reverberation as described in the edit instruction.

          Output ONLY valid JSON: {"score": <0/1>, "reason": "..."}
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          ## Original Audio Caption
          {{ audio_caption }}

          ## Expected Audio Caption After Edit
          {{ target_audio_caption }}

          Determine if the modified caption naturally and accurately indicates added reverberation (e.g., room or hall echo) as described in the edit instruction.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}

      - name: llm_judge_gemini
        score_key: score
        audio_keys:
          - eval_audio_path
        user_prompt: |-
          ## Edit Instruction
          {{ edit_prompt }}

          Listen to the audio carefully.
          Evaluate whether the audio sounds reverberant (e.g., as if recorded in a room or hall with echo)
          as described in the edit instruction, while remaining natural and intelligible.

          Output ONLY valid JSON: {"score": <0 or 1>, "reason": "..."}
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
  audio_effect_dereverb:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]