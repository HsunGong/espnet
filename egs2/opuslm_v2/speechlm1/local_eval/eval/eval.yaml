          ## Edit-Prompt
          {{ edit_prompt }}

          {% if target_audio_caption is defined and target_audio_caption %}
          ## Target Emotion Description
          {{ target_audio_caption }}
          {% endif %}

          ## Task
          Compare Audio1 vs Audio2 and judge whether Audio2:
          (A) Preserves the speech content and speaker identity (consistency), and
          (B) Successfully conveys the target emotion clearly and naturally (change quality).

          Use a very strict grading curve:
          5 = near-flawless, professional/studio-quality.
          Most typical AI outputs should fall in the 2–3 range.

          ## Metrics (ONLY these)
          1) consistency (1-5): Preservation / Faithfulness
            Did Audio2 preserve the speech content (words, meaning) and core speaker identity from Audio1?
            Check for: missing/altered words, broken sentences, changed speaker timbre beyond what emotion naturally requires, unintended content modifications, or AI artifacts corrupting original speech.
            5 = speech content and speaker identity fully preserved
            3 = mostly preserved but noticeable word errors or unintended speaker changes
            1 = significant speech content loss or speaker identity unrecognizable

          2) change_quality (1-5): Change Execution Quality
            Does Audio2 convincingly and genuinely express the target emotion?
            Check for: wrong emotion conveyed, flat/unconvincing expression, forced/robotic quality, exaggerated/caricature-like delivery, inconsistent emotion throughout, or audio degradation from the transformation.
            5 = emotion is clear, genuine, and naturally conveyed throughout
            3 = emotion is partially present but unconvincing or inconsistent
            1 = target emotion is absent, wrong emotion is conveyed, or expression is severely unnatural

          3) score (1-5): Overall (NOT a simple average)
            If there is any critical failure (wrong/absent emotion OR speech content severely damaged), the overall score must drop significantly.
            Score 5 should be rare and only given when both metrics are near-perfect.

