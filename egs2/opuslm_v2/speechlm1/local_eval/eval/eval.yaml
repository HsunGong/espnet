    #     Evaluate:
    #     1. edit_fidelity (1-5): Does the generated caption indicate the
    #        element is gone? 5 = fully removed, 1 = still present.
    #     2. audio_quality (1-5): Does the caption suggest clean removal without
    #        artifacts?
    #     3. coherence (1-5): Does the remaining audio description sound
    #        complete and natural?
    #     4. preservation (1-5): Are non-removed elements described as intact?
    #     5. score (1-5): Overall quality.

    #     Output ONLY valid JSON:
    #     {"edit_fidelity": <1-5>, "audio_quality": <1-5>, "coherence": <1-5>, "preservation": <1-5>, "score": <1-5>, "reason": "<≤60 words>"}
    #   user_prompt: |-
    #     ## Edit Instruction
    #     {{ edit_prompt }}

    #     ## Original Audio Description (before removal)
    #     {{ audio_caption }}

    #     ## Element That Should Be Removed
    #     {{ remove_audio_caption }}

    #     ## Generated Audio Caption (automatic captioner output)
    #     {{ target_caption_gen_now }}

    #     ## Expected Audio Description (after removal — reference)
    #     {{ target_audio_caption }}

    #     Evaluate whether the REMOVE edit was successfully applied.

    # --- Gemini ---
    - name: llm_judge_gemini
      score_key: score
      score_keys: [score, generation_quality, main_consistency, operation_effect]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an expert audio evaluator. You will listen to two audio clips:
          - **Audio A** = the ORIGINAL audio (before editing)
          - **Audio B** = the EDITED audio (after editing)

        A REMOVE operation was performed: a specific sound element was removed
        from the original audio track.

        ## Edit Instruction
        {{ edit_prompt }}

        ## Main Audio Content (should be preserved in Audio B)
        {% if metadata is defined and metadata.main is defined and metadata.main.audio_caption is defined %}{{ metadata.main.audio_caption }}{% else %}{{ audio_caption }}{% endif %}
        {% if metadata is defined and metadata.main is defined and metadata.main.human_labels is defined %}Event labels: {{ metadata.main.human_labels | join(", ") }}{% endif %}

        ## Element That Should Have Been Removed
        {{ remove_audio_caption | default('') }}
        {% if metadata is defined and metadata.x is defined and metadata.x.human_labels is defined %}Event labels: {{ metadata.x.human_labels | join(", ") }}{% endif %}

        Evaluate carefully on these dimensions:

        1. **generation_quality** (1-5): Overall production quality of Audio B.
           Assess clarity, naturalness, absence of artifacts/distortion.
           5 = clean and natural, 1 = heavy artifacts or degradation.

        2. **main_consistency** (1-5): Is the main audio content described above
           preserved consistently between Audio A and Audio B (excluding the
           removed element)?
           5 = perfectly preserved, 1 = main content altered or missing.

        3. **operation_effect** (1-5): Was the REMOVE operation successfully
           executed? Is the target element completely absent from Audio B?
           5 = fully removed, 1 = still fully present.

        4. **score** (1-5): Holistic overall assessment.

        Output ONLY valid JSON:
        {"generation_quality": <1-5>, "main_consistency": <1-5>, "operation_effect": <1-5>, "score": <1-5>, "reason": "<≤60 words>"}


  # ===========================================================================
  #  REPLACE OPERATION
  # ===========================================================================
  replace_scorers: &replace_scorers
    # --- OpenFLAM audio-event detector ---
    - name: clap_similarity
    - name: fad
    # - name: audio_event_flam

    # --- Qwen3-Omni ---
    - name: llm_judge_openai
      score_key: score
      score_keys: [score, consistency, change_quality]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an extremely strict, meticulous audio engineer and sound design expert. You are evaluating a REPLACE operation: Audio2 was created by removing one sound element from Audio1 and replacing it with a different element.

        You must base your judgment ONLY on:
        - Audio1 (original, contains the old element)
        - Audio2 (edited, old element replaced with new element)
        - Edit-Prompt (instruction)

        Ignore any captions/descriptions entirely, even if provided.

        ## Edit-Prompt
        {{ edit_prompt }}

        ## Original Audio Description
        {{ audio_caption }}

        ## Element That Was Removed (old)
        {{ remove_audio_caption }}

        ## Element That Was Added (new)
        {{ add_audio_caption }}

        ## Task
        Compare Audio1 vs Audio2 and judge whether Audio2:
        (A) Preserves all content that should NOT have changed (consistency), and
        (B) Successfully swaps the old element for the new one naturally (change quality).

        Use a very strict grading curve:
        5 = near-flawless, professional/studio-quality.
        Most typical AI outputs should fall in the 2–3 range.

        ## Metrics (ONLY these)
        1) consistency (1-5): Preservation / Faithfulness
          Did Audio2 preserve all audio content from Audio1 EXCEPT the replaced element?
          Check for: collateral damage to surrounding sounds, altered timing/rhythm, unintended removals/additions beyond the swap, tonal shifts, or AI artifacts corrupting preserved elements.
          5 = all non-target content fully preserved and natural
          3 = mostly preserved but noticeable collateral damage
          1 = severe damage to content that should have been kept

        2) change_quality (1-5): Change Execution Quality
          Is the old element absent AND the new element clearly present and naturally integrated?
          Check for: residual old element, missing/faint new element, unnatural transitions, timbre/reverb/loudness mismatch between the new element and surrounding audio, phase issues, or awkward blend boundaries.
          5 = swap fully executed with seamless integration
          3 = swap is partially done but with noticeable issues in removal or integration
          1 = swap failed — old element persists, new element absent, or both

        3) score (1-5): Overall (NOT a simple average)
          If there is any critical failure (swap not executed OR preserved content severely damaged), the overall score must drop significantly.
          Score 5 should be rare and only given when both metrics are near-perfect.

        ## Output format
        Output ONLY valid JSON. Do not include any extra text.
        Use EXACTLY these keys (do not add others):
        {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

    # # --- Captioner + LLM Judge ---
    # - name: llm_judge_caption_llm
    #   score_key: score
    #   score_keys: [score, edit_fidelity, audio_quality, coherence, preservation]
    #   system_prompt: |-
    #     You are an expert audio edit evaluator. You will compare an automatic
    #     caption of the generated audio against the expected description to
    #     evaluate a REPLACE operation (swapping one sound element for another).

    #     Evaluate:
    #     1. edit_fidelity (1-5): Does the caption indicate the old element
    #        is gone AND the new element is present?
    #        5 = swap fully evident, 1 = completely failed.
    #     2. audio_quality (1-5): Does the caption suggest good production
    #        quality?
    #     3. coherence (1-5): Does the described scene sound coherent with the
    #        new element integrated?
    #     4. preservation (1-5): Are unchanged elements described as intact?
    #     5. score (1-5): Overall quality.

    #     Output ONLY valid JSON:
    #     {"edit_fidelity": <1-5>, "audio_quality": <1-5>, "coherence": <1-5>, "preservation": <1-5>, "score": <1-5>, "reason": "<≤60 words>"}
    #   user_prompt: |-
    #     ## Edit Instruction
    #     {{ edit_prompt }}

    #     ## Original Audio Description (before replacement)
    #     {{ audio_caption }}

    #     ## Element That Was Removed (old)
    #     {{ remove_audio_caption }}

    #     ## Element That Was Added (new)
    #     {{ add_audio_caption }}

    #     ## Generated Audio Caption (automatic captioner output)
    #     {{ target_caption_gen_now }}

    #     ## Expected Audio Description (after replacement — reference)
    #     {{ target_audio_caption }}

    #     Evaluate whether the REPLACE edit was successfully applied.

    # --- Gemini ---
    - name: llm_judge_gemini
      score_key: score
      score_keys: [score, generation_quality, main_consistency, operation_effect]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an expert audio evaluator. You will listen to two audio clips:
          - **Audio A** = the ORIGINAL audio (before editing)
          - **Audio B** = the EDITED audio (after editing)

        A REPLACE operation was performed: one sound element was replaced with
        another within the audio track.

        ## Edit Instruction
        {{ edit_prompt }}

        ## Main Audio Content (should be preserved in Audio B)
        {% if metadata is defined and metadata.main is defined and metadata.main.audio_caption is defined %}{{ metadata.main.audio_caption }}{% else %}{{ audio_caption }}{% endif %}
        {% if metadata is defined and metadata.main is defined and metadata.main.human_labels is defined %}Event labels: {{ metadata.main.human_labels | join(", ") }}{% endif %}

        ## Element That Was Removed (old)
        {{ remove_audio_caption | default('') }}
        {% if metadata is defined and metadata.x is defined and metadata.x.human_labels is defined %}Event labels: {{ metadata.x.human_labels | join(", ") }}{% endif %}

        ## Element That Was Added (new)
        {{ add_audio_caption | default('') }}
        {% if metadata is defined and metadata.y is defined and metadata.y.human_labels is defined %}Event labels: {{ metadata.y.human_labels | join(", ") }}{% endif %}

        Evaluate carefully on these dimensions:

        1. **generation_quality** (1-5): Overall production quality of Audio B.
           Assess clarity, naturalness, absence of artifacts/distortion.
           5 = clean and natural, 1 = heavy artifacts or degradation.

        2. **main_consistency** (1-5): Is the main audio content described above
           preserved consistently between Audio A and Audio B?
           5 = perfectly preserved, 1 = main content altered or missing.

        3. **operation_effect** (1-5): Was the REPLACE operation successfully
           executed? Is the old element absent AND the new element present?
           5 = swap fully successful, 1 = completely failed.

        4. **score** (1-5): Holistic overall assessment.

        Output ONLY valid JSON:
        {"generation_quality": <1-5>, "main_consistency": <1-5>, "operation_effect": <1-5>, "score": <1-5>, "reason": "<≤60 words>"}


  # ===========================================================================
  #  CREATIVE EDIT (gen_v3 style — freeform audio transformation)
  # ===========================================================================
  creative_scorers: &creative_scorers
    # --- OpenFLAM audio-event detector ---
    # NOTE: creative edits may not have structured metadata.x / metadata.y,
    #       so audio_event_flam may produce errors for some samples — this is expected.
    # - name: audio_event_flam
    - name: fad

    # --- Qwen3-Omni ---
    - name: llm_judge_openai
      score_key: score
      score_keys: [score, consistency, change_quality]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an extremely strict, meticulous audio engineer and sound design expert. You are evaluating a CREATIVE EDIT: Audio2 is a freeform transformation of Audio1 based on a natural-language instruction.

        You must base your judgment ONLY on:
        - Audio1 (original)
        - Audio2 (edited)
        - Edit-Prompt (instruction)

        Ignore any captions/descriptions entirely, even if provided.

        ## Edit-Prompt
        {{ edit_prompt }}

        ## Task
        Compare Audio1 vs Audio2 and judge whether Audio2:
        (A) Preserves what should NOT have changed (consistency), and
        (B) Implements the requested changes well (change quality).

        Use a very strict grading curve:
        5 = near-flawless, professional/studio-quality.
        Most typical AI outputs should fall in the 2–3 range.

        ## Metrics (ONLY these)
        1) consistency (1-5): Preservation / Faithfulness
          Did Audio2 preserve the key elements of Audio1 that were NOT requested to change?
          Check for: damage to the main subject, broken timing/groove, unnatural shifts in room tone/reverb, unintended removals/additions, or AI artifacts that alter the original character.
          5 = fully preserved and natural
          3 = mostly preserved but noticeable deviations
          1 = major unintended changes or loss of core identity

        2) change_quality (1-5): Change Execution Quality
          Did Audio2 perform ALL required changes specified by the Edit-Prompt, and do they sound natural and usable?
          Check for: missing/incorrect edits, awkward cuts, unnatural transitions, mismatched timbre/reverb/loudness, metallic ringing, phase issues, smearing, distortion, etc.
          5 = edits are accurate and seamless
          3 = main change is present but details/naturalness are lacking
          1 = core requested change is not achieved or is severely unnatural

        3) score (1-5): Overall (NOT a simple average)
          If there is any critical failure (missing core requested change OR severely harming consistency), the overall score must drop significantly.
          Score 5 should be rare and only given when both metrics are near-perfect.

        ## Output format
        Output ONLY valid JSON. Do not include any extra text.
        Use EXACTLY these keys (do not add others):
        {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

    # --- Captioner + Embedding Similarity ---
    # Flow: captioner generates a caption for eval_audio_path, then cosine
    # similarity is computed between the generated caption embedding and the
    # target_audio_caption embedding via /v1/embeddings.
    - name: llm_judge_caption_llm
      mode: embedding
      ref_caption_key: target_audio_caption
      score_keys: [score, caption_similarity]

    # --- Gemini ---
    - name: llm_judge_gemini
      score_key: score
      score_keys: [score, consistency, change_quality]
      audio_keys: [audio_path, eval_audio_path]
      user_prompt: |-
        You are an extremely strict, meticulous audio engineer and sound design expert. You are evaluating a CREATIVE EDIT: Audio2 is a freeform transformation of Audio1 based on a natural-language instruction.

        You must base your judgment ONLY on:
        - Audio1 (original)
        - Audio2 (edited)
        - Edit-Prompt (instruction)

        Ignore any captions/descriptions entirely, even if provided.

        ## Edit-Prompt
        {{ edit_prompt }}

        ## Task
        Compare Audio1 vs Audio2 and judge whether Audio2:
        (A) Preserves what should NOT have changed (consistency), and
        (B) Implements the requested changes well (change quality).

        Use a very strict grading curve:
        5 = near-flawless, professional/studio-quality.
        Most typical AI outputs should fall in the 2–3 range.

        ## Metrics (ONLY these)
        1) consistency (1-5): Preservation / Faithfulness
          Did Audio2 preserve the key elements of Audio1 that were NOT requested to change?
          Check for: damage to the main subject, broken timing/groove, unnatural shifts in room tone/reverb, unintended removals/additions, or AI artifacts that alter the original character.
          5 = fully preserved and natural
          3 = mostly preserved but noticeable deviations
          1 = major unintended changes or loss of core identity

        2) change_quality (1-5): Change Execution Quality
          Did Audio2 perform ALL required changes specified by the Edit-Prompt, and do they sound natural and usable?
          Check for: missing/incorrect edits, awkward cuts, unnatural transitions, mismatched timbre/reverb/loudness, metallic ringing, phase issues, smearing, distortion, etc.
          5 = edits are accurate and seamless
          3 = main change is present but details/naturalness are lacking
          1 = core requested change is not achieved or is severely unnatural

        3) score (1-5): Overall (NOT a simple average)
          If there is any critical failure (missing core requested change OR severely harming consistency), the overall score must drop significantly.
          Score 5 should be rare and only given when both metrics are near-perfect.

        ## Output format
        Output ONLY valid JSON. Do not include any extra text.
        Use EXACTLY these keys (do not add others):
        {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

