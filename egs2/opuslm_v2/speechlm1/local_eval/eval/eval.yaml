tasks:
  # ------------------------------------------------------------------
  # Transcription edits — objective metrics only (WER + SPK + MOS)
  # ------------------------------------------------------------------
  transcription_ins:
    scorers:
      - name: asr_wer
      # - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

  transcription_del:
    scorers:
      - name: asr_wer
      # - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

  transcription_sub:
    scorers:
      - name: asr_wer
      # - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

  transcription_replace_sentence:
    scorers:
      - name: asr_wer
      # - name: speaker_similarity_wespeaker
      - name: speaker_similarity_wavlm
      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

  # ------------------------------------------------------------------
  # transcription_add_paralinguistic
  #   Aspects: paralinguistic_presence, position_accuracy,
  #            content_preservation, naturalness
  # ------------------------------------------------------------------
  transcription_add_paralinguistic:
    scorers:
      # - name: speaker_similarity_wespeaker

      - name: llm_judge_openai
        score_key: score
        score_keys: [score, consistency, change_quality]
        audio_keys: [audio_path, eval_audio_path]
        user_prompt: &add_para_user |-
          You are an extremely strict, meticulous audio engineer and speech expert. You are evaluating a PARALINGUISTIC INSERTION: Audio2 was created by adding a paralinguistic event (e.g., laughter, cough, breath, filler word) into Audio1's speech.

          You must base your judgment ONLY on:
          - Audio1 (original speech)
          - Audio2 (edited speech with paralinguistic insertion)
          - Edit-Prompt (instruction)

          Ignore any captions/descriptions entirely, even if provided.

          ## Edit-Prompt
          {{ edit_prompt }}

          {% if target_text is defined and target_text %}
          ## Expected Transcription
          {{ target_text }}
          {% endif %}

          ## Task
          Compare Audio1 vs Audio2 and judge whether Audio2:
          (A) Preserves the original speech content and speaker identity (consistency), and
          (B) Correctly inserts the paralinguistic event at the right position naturally (change quality).

          Use a very strict grading curve:
          5 = near-flawless, professional/studio-quality.
          Most typical AI outputs should fall in the 2–3 range.

          ## Metrics (ONLY these)
          1) consistency (1-5): Preservation / Faithfulness
            Did Audio2 preserve the speech content (words, meaning) and speaker characteristics from Audio1?
            Check for: missing/altered words, changed speaker identity/timbre, broken prosody, timing shifts in surrounding speech, or AI artifacts corrupting the original speech.
            5 = speech content and speaker fully preserved
            3 = mostly preserved but noticeable word changes or speaker drift
            1 = significant speech content loss or speaker identity change

          2) change_quality (1-5): Change Execution Quality
            Is the paralinguistic event clearly audible at the correct position and does it sound natural?
            Check for: missing/inaudible event, wrong position, unnatural sounding event, awkward transitions into/out of the event, forced or robotic quality, or timing misalignment with surrounding speech.
            5 = event is present, correctly positioned, and seamlessly natural
            3 = event is present but position or naturalness is noticeably off
            1 = event is absent, at completely wrong position, or sounds severely unnatural

          3) score (1-5): Overall (NOT a simple average)
            If there is any critical failure (event missing/misplaced OR speech content severely altered), the overall score must drop significantly.
            Score 5 should be rare and only given when both metrics are near-perfect.

          ## Output format
          Output ONLY valid JSON. Do not include any extra text.
          Use EXACTLY these keys (do not add others):
          {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

      - name: llm_judge_gemini
        audio_keys: [audio_path, eval_audio_path]
        system_prompt: *llm_judge_sys
        user_prompt: *add_para_user

      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

  # ------------------------------------------------------------------
  # style_whisper
  #   Aspects: style_conformity, content_preservation,
  #            expressiveness, audio_quality
  # ------------------------------------------------------------------
  style_whisper:
    scorers:
      - name: asr_wer
      - name: speaker_similarity_wavlm

      - name: llm_judge_openai
        score_key: score
        score_keys: [score, consistency, change_quality]
        audio_keys: [audio_path, eval_audio_path]
        user_prompt: &style_whisper_user |-
          You are an extremely strict, meticulous audio engineer and speech expert. You are evaluating a SPEAKING STYLE EDIT: Audio2 was created by changing the speaking style of Audio1 (e.g., whispering, fast/slow pace, pitch/tone change).

          You must base your judgment ONLY on:
          - Audio1 (original speech)
          - Audio2 (edited speech with style change)
          - Edit-Prompt (instruction)

          Ignore any captions/descriptions entirely, even if provided.

          ## Edit-Prompt
          {{ edit_prompt }}

          {% if target_audio_caption is defined and target_audio_caption %}
          ## Target Style Description
          {{ target_audio_caption }}
          {% endif %}

          ## Task
          Compare Audio1 vs Audio2 and judge whether Audio2:
          (A) Preserves the speech content and speaker identity (consistency), and
          (B) Successfully applies the requested style change clearly and naturally (change quality).

          Use a very strict grading curve:
          5 = near-flawless, professional/studio-quality.
          Most typical AI outputs should fall in the 2–3 range.

          ## Metrics (ONLY these)
          1) consistency (1-5): Preservation / Faithfulness
            Did Audio2 preserve the speech content (words, meaning) and core speaker identity from Audio1?
            Check for: missing/altered words, broken sentences, unintended changes beyond the style edit, loss of intelligibility, or AI artifacts corrupting original speech content.
            5 = speech content fully preserved and intelligible
            3 = mostly preserved but noticeable word errors or intelligibility loss
            1 = significant speech content loss or completely unintelligible

          2) change_quality (1-5): Change Execution Quality
            Does Audio2 clearly and convincingly exhibit the target speaking style?
            Check for: insufficient style change (sounds identical to original), wrong style applied, forced/robotic quality, unnatural prosody, inconsistent style throughout, artifacts from style transformation, or degraded audio quality.
            5 = style change is clear, convincing, and natural throughout
            3 = style change is partially achieved but inconsistent or unnatural
            1 = style change is absent, wrong, or severely degrades the speech

          3) score (1-5): Overall (NOT a simple average)
            If there is any critical failure (style not applied OR speech content severely damaged), the overall score must drop significantly.
            Score 5 should be rare and only given when both metrics are near-perfect.

          ## Output format
          Output ONLY valid JSON. Do not include any extra text.
          Use EXACTLY these keys (do not add others):
          {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

      - name: llm_judge_gemini
        audio_keys: [audio_path, eval_audio_path]
        system_prompt: *llm_judge_sys
        user_prompt: *style_whisper_user

      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

