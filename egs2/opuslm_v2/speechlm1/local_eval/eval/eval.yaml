  audio_effect_reverb:
    scorers:
      - name: llm_judge_openai
        score_key: score
        score_keys: [score, consistency, change_quality]
        audio_keys: [audio_path, eval_audio_path]
        user_prompt: &reverb_user |-
          You are an extremely strict, meticulous audio engineer and acoustics expert. You are evaluating a REVERB EFFECT: Audio2 was created by applying reverberation/echo to Audio1.

          You must base your judgment ONLY on:
          - Audio1 (original, dry audio)
          - Audio2 (edited, with reverb applied)
          - Edit-Prompt (instruction)

          Ignore any captions/descriptions entirely, even if provided.

          ## Edit-Prompt
          {{ edit_prompt }}

          ## Task
          Compare Audio1 vs Audio2 and judge whether Audio2:
          (A) Preserves the speech content and intelligibility (consistency), and
          (B) Successfully applies natural-sounding reverb as instructed (change quality).

          Use a very strict grading curve:
          5 = near-flawless, professional/studio-quality.
          Most typical AI outputs should fall in the 2–3 range.

          ## Metrics (ONLY these)
          1) consistency (1-5): Preservation / Faithfulness
            Did Audio2 preserve the speech content, intelligibility, and speaker identity from Audio1?
            Check for: lost/garbled words due to excessive reverb, altered speaker timbre beyond reverb effect, unexpected content changes, clipping, or AI artifacts corrupting the original speech.
            5 = speech fully intelligible and speaker identity preserved
            3 = mostly intelligible but reverb causes noticeable clarity loss
            1 = speech unintelligible or speaker identity unrecognizable

          2) change_quality (1-5): Change Execution Quality
            Is the reverb effect appropriately and naturally applied?
            Check for: missing/barely perceptible reverb, excessive/overwhelming reverb drowning the speech, unnatural metallic or ringing quality, inconsistent reverb characteristics, artificial-sounding reflections, or processing artifacts.
            5 = reverb is clearly present, natural, and sounds like a real acoustic space
            3 = reverb is present but sounds artificial or poorly calibrated
            1 = reverb is absent, sounds completely artificial, or causes severe degradation

          3) score (1-5): Overall (NOT a simple average)
            If there is any critical failure (no reverb applied OR speech made unintelligible), the overall score must drop significantly.
            Score 5 should be rare and only given when both metrics are near-perfect.

          ## Output format
          Output ONLY valid JSON. Do not include any extra text.
          Use EXACTLY these keys (do not add others):
          {"consistency": <1-5>, "change_quality": <1-5>, "score": <1-5>, "reason": "<<=60 words; cite concrete flaws and justify deductions>"}

      - name: llm_judge_gemini
        audio_keys: [audio_path, eval_audio_path]
        system_prompt: *llm_judge_sys
        user_prompt: *reverb_user

      - name: pseudo_mos
        predictor_types: ["dnsmos", "utmos"]

