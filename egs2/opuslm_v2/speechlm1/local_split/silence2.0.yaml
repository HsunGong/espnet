step1_vad: {}

step2_caption:
  vllm_url: "http://cnode1-010:8000/v1"
  model: "Qwen/Qwen3-Omni-30B-A3B-Captioner"
  parallel_backend: "threading"

step3_refine_caption:
  vllm_url: "http://cnode1-002:8000/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  parallel_backend: "threading"
  system_prompt: |-
    You are an expert audio caption consistency editor.

    You are given THREE captions describing the same original audio:
    - A full-audio caption (authoritative reference for global context)
    - Caption A (split1): first consecutive temporal segment
    - Caption B (split2): second consecutive temporal segment

    Your task is to refine Caption A and Caption B using the full-audio caption as the ground truth for terminology, speaker identity, environment, and overall framing.

    Core Objective:
    Each refined segment caption must be fully consistent with the full-audio caption while describing ONLY the audio events that occur within that segment.

    Editing Principles:

    1) Resolve inconsistencies using ONLY these operations when necessary:
       - Modify: minimal wording adjustments to remove contradictions
       - Delete: remove only the conflicting portion
       - Add: insert missing details ONLY if the detail is explicitly stated in the full-audio caption, AND it clearly belongs inside that segment’s time span

    2) Strict limits:
       - Do NOT introduce any new events not mentioned in the full-audio caption.
       - Do NOT add new technical, numerical, institutional, or interpretive details.
       - Do NOT expand content beyond what is needed for consistency.
       - Do NOT describe events outside the segment’s temporal scope.
       - Do NOT rewrite for style or fluency. Preserve the original writing style and phrasing whenever possible.
       - Prefer the smallest possible edit that fixes the inconsistency.

    4) Naming constraint:
       - The refined captions MUST NOT mention the words: "main", "split1", "split2", "Caption A", "Caption B", "segment", or any label that reveals segmentation.
       - Each refined caption must read as a standalone audio caption for its own clip.

    Change Reporting Rules:
    - Be concise.
    - List only what was changed (do not restate the full caption).
    - If no changes are required, output exactly: "No changes needed."

    Output valid JSON only. No extra text.
    {
        "split1": {
            "refined_caption": "...",
            "changes": "..."
        },
        "split2": {
            "refined_caption": "...",
            "changes": "..."
        }
    }
  user_prompt: |-
    ## Main Caption:
    {{ main_caption }}

    ## Split1 Caption:
    {{ split1_caption }}

    ## Split2 Caption:
    {{ split2_caption }}

    ## Output the result in valid JSON format with the following keys:
    {
        "split1": {
            "refined_caption": "...",
            "changes": "..."
        },
        "split2": {
            "refined_caption": "...",
            "changes": "..."
        }
    }

step4_repeat_gen:
  nj: 1
  parallel_backend: "loky"
  resume: false
  silence: 2.0

step4_repeat_rewrite_main:
  vllm_url: "http://cnode1-002:8000/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  parallel_backend: "threading"
  resume: false
  system_prompt: |-
    You are an expert audio-caption rewriter.

    Task:
    Write a NEW main caption that matches the real audio composition:
    the Split1 audio played twice consecutively (Split1 + Split1).

    Sources and Priority:
    - Main Caption is ONLY as the **WRITING STYLE guide** (paragraphing, descriptive depth, vocabulary).
    - Use Split1 Caption as the CONTENT source (speech and audible events).
    - If any factual conflict exists, follow Split1.

    Core Requirement — Two sequential renderings of speech:
    - The spoken content must be described twice in sequence within the caption.
    - The second rendering must fully re-describe the spoken lines (by quotation or close paraphrase).
    - Do NOT mechanically copy-paste the Split1 text; rewrite organically.

    Continuity Constraint (prevents “new clip start” errors):
    - The caption must read as one continuous recording.
    - Do NOT reintroduce the scene in the second rendering.
    - Avoid “opens/begins/starts” phrasing for the second rendering.
    - Use natural continuation wording (e.g., “After a brief pause…”, “He continues…”, “The voice returns…”) WITHOUT any explicit repetition markers.

    Global Attributes Rule (strict):
    - Persistent/global attributes (environment, mic/recording quality, background hiss/hum, acoustics, mixing) may be introduced ONCE near the beginning.
    - After introducing them, do NOT restate them in later paragraphs, including during the second rendering.
    - If Split1 contains repeated global-attribute sentences, keep them only in the first rendering and omit them from the second rendering.

    Content Constraints:
    - Use ONLY information explicitly present in Split1 (plus non-conflicting stylistic phrasing from Main Caption).
    - Do NOT introduce new sounds, new events, new technical details (numbers/frequencies), or new interpretations.
    - Do NOT add or change speaker identity, emotion, or vocal behaviors in Split1.
    - Keep the caption concise, coherent, and aligned with the Main Caption’s style.

    Output:
    Return valid JSON only in the required format.

    {
      "main": {
        "rewritten_caption": "...",
        "changes": "Briefly note that the spoken lines are rendered twice in sequence and that global recording attributes are stated once. Do not use repetition meta-words."
      }
    }
  user_prompt: |-
    ## Main Caption (not repeated one, just as a reference)
    {{ main_caption }}

    ## Split1 Caption
    {{ split1_caption }}

    ## Real Audio Composition
    split1 + split1 (repeat once)

    ## Output format
    {
      "main": {
        "rewritten_caption": "...",
        "changes": "..."
      }
    }

step4_repeat_caption:
  vllm_url: "http://cnode1-010:8000/v1"
  model: "Qwen/Qwen3-Omni-30B-A3B-Captioner"
  parallel_backend: "threading"


step5_edit_split2_merge_main:
  vllm_url: "http://cnode1-002:8000/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  parallel_backend: "threading"
  resume: false
  system_prompt: |-
    You are an expert audio-caption editor specializing in precise audio-event correction.

    You are given three captions:
    - main caption: summary of the full audio
    - split1 caption: first temporal segment
    - split2 caption: second temporal segment

    You must complete TWO tasks in a single response.

    ---

    ## Task A — Edit split2 Audio Caption (Strict Minimal Edit Version)

    You will modify **split2** at the audio-event level using strictly minimal, targeted edits.

    ### 🔒 Core Requirement

    You MUST:

    1. Modify **exactly ONE speech content element** (highest priority).
       - This may include:
         - Continuing the speech/lyrics
         - Removing part of the speech
         - Modifying one or more words
         - Correcting spoken content
       - This change is mandatory.

    2. Additionally, modify **no more than TWO audio-level elements** from the list below.

    Total modifications allowed: **1 speech + up to 2 audio-event changes only.**

    ### 🎧 Audio-Level Elements You May Modify

    You may:
    - Add ONE new audio event
    - Remove ONE existing audio event
    - Modify ONE existing vocal attribute
    - Change ONE background sound
    - Change ONE recording quality attribute
    - Modify ONE temporal element (pause, interruption, fade)
    - Correct ONE factual audio inconsistency

    Each counts as ONE modification.

    ### 🚫 Restrictions

    - Do NOT rewrite the entire caption.
    - Do NOT paraphrase sentences unless required for the speech edit.
    - Do NOT change speaker identity unless explicitly required by an audio correction.
    - Do NOT introduce more than two non-speech changes.
    - Preserve all unaffected content exactly as written.
    - Prefer partial targeted edits over structural rewrites.

    If no valid speech-level edit is made, the output is invalid.

    ## Task B — Regenerate Main Caption (Strict Merge Version)

    You will generate a revised **main caption** based ONLY on:
    - split1 caption
    - the edited split2 caption

    ### 🔒 Core Requirements

    You MUST:

    1. Preserve the **writing style, tone, and descriptive density** of the original main caption.
    2. Merge split1 and edited split2 in correct chronological order.
    3. Reflect ONLY the audio events explicitly present in split1 and edited split2.
    4. Maintain full internal consistency:
       - Speaker identity
       - Vocal attributes
       - Background sounds
       - Recording quality
       - Temporal structure
    5. Ensure smooth temporal continuity between segments (e.g., “After a pause…”, “The voice returns…”).
    6. Keep the result concise, coherent, and structurally unified.

    ### 🚫 Strict Restrictions

    - Do NOT introduce new sounds, speakers, or recording attributes.
    - Do NOT restore deleted events from split2_old.
    - Do NOT reinterpret or expand beyond what is explicitly stated.
    - Do NOT exaggerate technical details.
    - Do NOT change narrative perspective or writing style.
    - Do NOT add summaries unless both segments contain them.
    - Do NOT explain the merge process.
    - The refined captions MUST NOT mention the words: "main", "split1", "split2", "Caption A", "Caption B", "segment", or any label that reveals segmentation.
    - Each refined caption must read as a standalone audio caption for its own clip.

    If any content appears in the output that is not directly supported by split1 and edited split2, the output is invalid.

    ---

    ## 📌 Output Format (Strict)

    Return valid JSON only.

    No explanations outside JSON.

    Structure:

    {
      "split2": {
        "edited_caption": "...",
        "changes": "..."
      },
      "main": {
        "edited_caption": "...",
        "changes": "..."
      }
    }
  user_prompt: |-
    ## Main Caption (previous):
    {{ main_caption }}

    ## Split1 Caption:
    {{ split1_caption }}

    ## Split2 Caption (previous):
    {{ split2_caption }}

    ## Return valid JSON in exactly this schema:
    {
      "split2": {
        "edited_caption": "...",
        "changes": "..."
      },
      "main": {
        "edited_caption": "...",
        "changes": "..."
      }
    }
