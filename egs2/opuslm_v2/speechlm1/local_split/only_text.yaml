step1_vad: {}

step2_caption:
  vllm_url: "http://localhost:8000/v1"
  model: "Qwen/Qwen3-Omni-30B-A3B-Captioner"
  parallel_backend: "threading"

step3_refine_caption:
  vllm_url: "http://cnode1-002:8000/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  parallel_backend: "threading"
  system_prompt: |-
    You are an expert audio caption consistency editor.

    You are given THREE captions describing the same original audio:
    - A full-audio caption (authoritative reference for global context)
    - Caption A (split1): first consecutive temporal segment
    - Caption B (split2): second consecutive temporal segment

    Your task is to refine Caption A and Caption B using the full-audio caption as the ground truth for terminology, speaker identity, environment, and overall framing.

    Core Objective:
    Each refined segment caption must be fully consistent with the full-audio caption while describing ONLY the audio events that occur within that segment.

    Editing Principles:

    1) Resolve inconsistencies using ONLY these operations when necessary:
       - Modify: minimal wording adjustments to remove contradictions
       - Delete: remove only the conflicting portion
       - Add: insert missing details ONLY if the detail is explicitly stated in the full-audio caption, AND it clearly belongs inside that segment’s time span

    2) Strict limits:
       - Do NOT introduce any new events not mentioned in the full-audio caption.
       - Do NOT add new technical, numerical, institutional, or interpretive details.
       - Do NOT expand content beyond what is needed for consistency.
       - Do NOT describe events outside the segment’s temporal scope.
       - Do NOT rewrite for style or fluency. Preserve the original writing style and phrasing whenever possible.
       - Prefer the smallest possible edit that fixes the inconsistency.

    4) Naming constraint:
       - The refined captions MUST NOT mention the words: "main", "split1", "split2", "Caption A", "Caption B", "segment", or any label that reveals segmentation.
       - Each refined caption must read as a standalone audio caption for its own clip.

    Change Reporting Rules:
    - Be concise.
    - List only what was changed (do not restate the full caption).
    - If no changes are required, output exactly: "No changes needed."

    Output valid JSON only. No extra text.
    {
        "split1": {
            "refined_caption": "...",
            "changes": "..."
        },
        "split2": {
            "refined_caption": "...",
            "changes": "..."
        }
    }
  user_prompt: |-
    ## Main Caption:
    {{ main_caption }}

    ## Split1 Caption:
    {{ split1_caption }}

    ## Split2 Caption:
    {{ split2_caption }}

    ## Output the result in valid JSON format with the following keys:
    {
        "split1": {
            "refined_caption": "...",
            "changes": "..."
        },
        "split2": {
            "refined_caption": "...",
            "changes": "..."
        }
    }

step4_repeat_gen:
  nj: 1
  parallel_backend: "loky"
  resume: false

step4_repeat_rewrite_main:
  vllm_url: "http://cnode1-002:8000/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  parallel_backend: "threading"
  resume: false
  system_prompt: |-
    You are an expert audio-caption editor.

    Task:
    Generate a new main caption for an audio recording that consists of:
    Split1 played twice consecutively (Split1 + Split1).

    You are given ONLY the Split1 caption.

    Content Source Rule (Absolute):
    - Use Split1 caption as the ONLY source of content.
    - Do NOT rely on or assume any previous main caption.
    - Do NOT introduce any new events, sounds, speakers, or interpretations.

    Writing Style Rule (Strict Lock):
    - The rewritten caption MUST match Split1’s writing style exactly.
    - Preserve its tone, sentence structure, phrasing pattern, and descriptive density.
    - Do NOT reformat paragraph structure.
    - Do NOT elevate or compress the description.

    Speech Repetition Rule (Very Strict):
    - Identify all quoted speech content in Split1.
    - Duplicate the quoted speech content exactly once.
    - The duplicated speech must appear immediately after the first occurrence.
    - The repeated speech MUST remain inside quotation marks.
    - Do NOT paraphrase.
    - Do NOT rewrite surrounding sentence structure.
    - Do NOT add transition phrases (e.g., “he repeats”, “again”, “the voice returns”).
    - Only duplicate the speech text inside quotation marks.

    Non-Speech Rule:
    - All non-speech content (background sounds, environment, recording quality,
      vocal tone, pacing, etc.) must appear exactly once.
    - Do NOT duplicate any non-speech description.

    Structural Constraint:
    - The caption must read naturally as a single continuous recording.
    - Do NOT explicitly reference repetition.
    - Do NOT mention duplication.
    - Do NOT insert commentary about the structure.

    Output valid JSON only:

    {
      "main": {
        "rewritten_caption": "...",
        "changes": "State that the quoted speech content was duplicated once. No additional explanation."
      }
    }
  user_prompt: |-
    ## Split1 Caption
    {{ split1_caption }}

    ## Real Audio Composition
    split1 + split1 (repeat once)

    ## Output format
    {
      "main": {
        "rewritten_caption": "...",
        "changes": "..."
      }
    }

step5_edit_split2_merge_main:
  vllm_url: "http://cnode1-002:8000/v1"
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507-FP8"
  parallel_backend: "threading"
  resume: false
  system_prompt: |-
    You are an expert audio-caption editor specializing in controlled speech-level modification and cross-caption consistency.

    You are given:
    - The previous main caption
    - The Split1 caption
    - The previous Split2 caption

    You must perform TWO sequential operations in strict order.

    --------------------------------
    TASK A — Modify main-caption (Speech Edit Only)
    --------------------------------

    1. Locate the portion of the main caption that corresponds to Split2's spoken content.

    2. Modify ONLY that Split2-related speech portion.

    3. You MUST perform ONE of the following:

      Option A:
        - Modify at least 2–3 words within the Split2 speech content.

      OR

      Option B:
        - Completely rewrite one full sentence describing Split2 speech.

      Minor punctuation edits do NOT count.
      Word substitution must change semantic content.

    4. Strict Restrictions for TASK A:
      - Do NOT modify any Split1-related content.
      - Do NOT modify background sounds.
      - Do NOT modify recording quality.
      - Do NOT modify speaker identity.
      - Do NOT change paragraph structure.
      - Do NOT introduce new events.
      - Do NOT modify more than one speech sentence.
      - Preserve the original writing style of the main caption exactly.

    After completing TASK A, treat the edited main caption as the authoritative version.

    --------------------------------
    TASK B — Regenerate Split2 Caption
    --------------------------------

    5. Based ONLY on:
      - The edited portion of the main caption that corresponds to Split2
      - The original Split2 caption for structural reference

    6. Generate a new Split2 caption that:

      - Reflects the updated speech content from the edited main caption.
      - Remains temporally limited to Split2 events only.
      - Preserves Split2’s original writing style.
      - Maintains consistency with Split1 and the edited main caption.
      - Does NOT introduce new sounds or events.
      - Does NOT restore removed content.
      - Does NOT expand beyond the original Split2 scope.

    7. The regenerated Split2 caption must read as a standalone audio caption.

    --------------------------------
    OUTPUT FORMAT (Strict JSON Only)
    --------------------------------

    {
      "main": {
        "edited_caption": "...",
        "changes": "Briefly describe whether 2–3 words were modified or one sentence was rewritten."
      },
      "split2": {
        "edited_caption": "...",
        "changes": "State that Split2 was regenerated to align with the modified main speech content."
      }
    }

  user_prompt: |-
    ## Main Caption (previous):
    {{ main_caption }}

    ## Split1 Caption:
    {{ split1_caption }}

    ## Split2 Caption (previous):
    {{ split2_caption }}

    ## Return valid JSON in exactly this schema:
    {
      "main": {
        "edited_caption": "...",
        "changes": "..."
      },
      "split2": {
        "edited_caption": "...",
        "changes": "..."
      }
    }
