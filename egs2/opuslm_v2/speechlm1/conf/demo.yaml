# ---------- appendix ----------
appendix:
  title: "Appendix"
  content: |
    <!-- ====== 1. Evaluation Framework ====== -->
    <h4>1. Evaluation Framework
      <a href="configs/eval.yaml" target="_blank" style="font-size:.75em; font-weight:normal; margin-left:.5em;">
        &#128196; eval.yaml
      </a>
    </h4>
    <p>Three independent LLM judges (Qwen3-Omni, Gemini, Caption+LLM) each receive
    the original and edited audio clips and score on a 1&#x2013;5 scale.
    Shared system prompt:</p>
    <pre class="bg-light border rounded p-3" style="font-size:.82rem;">You are an expert speech audio evaluator.
    You will receive two audio clips:
      - Audio A = the ORIGINAL audio (before editing)
      - Audio B = the EDITED audio (after editing)
    Compare them carefully on multiple quality aspects.

    Scoring rubric for EACH aspect (integer 1-5):
      5 = Excellent  4 = Good  3 = Fair  2 = Poor  1 = Very Poor

    Be strict, consistent, and unbiased.
    Output ONLY valid JSON with the keys specified in the user message.</pre>
    <p>Evaluation dimensions (<em>JSON keys</em>):</p>
    <table class="table table-sm table-bordered" style="font-size:.88rem;">
      <thead><tr><th>Task group</th><th>Dimensions</th></tr></thead>
      <tbody>
        <tr>
          <td>Speech editing</td>
          <td><code>consistency</code> &middot; <code>change_quality</code> &middot; <code>score</code></td>
        </tr>
        <tr>
          <td>Audio / Creative editing</td>
          <td><code>edit_fidelity</code> &middot; <code>audio_quality</code> &middot; <code>coherence</code> &middot; <code>preservation</code> &middot; <code>score</code></td>
        </tr>
      </tbody>
    </table>

    <!-- ====== 2. Configuration YAMLs ====== -->
    <h4>2. Configuration YAMLs</h4>

    <h5>Training &#8212;
      <a href="configs/train.yaml" target="_blank">conf/train_stage3_mt.yaml</a>
    </h5>
    <pre class="bg-light border rounded p-3" style="font-size:.82rem;">multimodal_io:
      text:            { tokenizer_name: Qwen/Qwen3-8B-Base }
      discrete_audio:  { codec_hf_model_tag: hf-audio/xcodec-hubert-general, delay_interleave: true }
      continuous_audio:{ encoder_hf_model_tag: Qwen/Qwen3-Omni-30B-A3B-Instruct, dtype: bfloat16 }
    model:    { model_hf_tag: Qwen/Qwen3-8B-Base, model_choice: parallel }
    preprocessor: { audio_cfg: 0.05 }     # 5% condition drop for CFG
    trainer:
      deepspeed_config: conf/ds_acc4_tot500k.json
      freeze_param: [multimodal_io_dict.discrete_audio, multimodal_io_dict.continuous_audio]
      max_step: 356_000</pre>

    <h5>Inference &#8212;
      <a href="configs/infer.yaml" target="_blank">conf/inference_audio.yaml</a>
    </h5>
    <pre class="bg-light border rounded p-3" style="font-size:.82rem;">single_turn:
      enforce_modality: [audio]
      audio: { temperature: 0.8, topk: 20, cfg: 3, max_step: 2048 }

    multi_turn:
      enforce_modality: [audio]
      audio: { temperature: 0.8, topk: 20, cfg: 3, max_step: 2048 }</pre>
