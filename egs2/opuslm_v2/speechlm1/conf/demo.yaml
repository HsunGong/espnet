# ---------- abstract ----------
abstract: |
  Current text-guided audio editing methods rely on paired training data, predefined operation templates, and separate processing pipelines across speech, music, and sound. We present <b><i>Bagpiper-Edit</i></b> to enable <b>open-ended audio editing via free-form natural language instructions</b>. We reformulate audio editing as a <b>rich-caption rewriting task</b> by treating a rich caption as the <b>semantic representation of an audio clip</b>. The user request is translated into an edited caption, which then guides <b><i>Bagpiper-Edit</i></b> to generate the target edited audio with the original audio as <b>contextual acoustic anchor</b>. This <b>unlocks the potential of free-form editing</b>, and <b>circumvents the need for paired audio-editing training data</b>, enabling <b>powerful zero-shot editing capabilities</b>. Evaluations across speech, audio, and free-form editing show <b><i>Bagpiper-Edit</i></b> maintains <b>good consistency to the original audio</b> and achieves <b>similar performance to other expert models in most cases</b>.

