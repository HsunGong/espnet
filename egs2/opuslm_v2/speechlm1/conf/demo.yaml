# ---------- model architecture figures (shown in Models section) ----------
model_figures:
  - src: "imgs/freeform-edit.png"
    title: "Zero-Shot Inference: Bagpiper-Edit Three-Stage Inference Pipeline"
    caption: "<em>Bagpiper-Edit</em> treats a rich caption as the semantic representation of an audio clip, and defines editing as a text-space transformation before materializing the edited audio via anchored original audio."
  - src: "imgs/bagpiper-edit.png"
    title: "Dialogue Patterns: Single-Turn (ST) vs. Multi-Turn (MT)"
    caption: "Dialogue patterns for <em>Bagpiper-Edit</em>. (a) The Single-Turn (<em>ST</em>) pattern concatenates captions and audio within a single interaction turn. (b) The Multi-Turn (<em>MT</em>) pattern structures the input as a two-round sequential dialogue. U denotes user and A denotes assistant, both are special tags inherited from <em>Bagpiper-Base</em>."

